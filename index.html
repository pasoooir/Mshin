<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#173d2c"><meta name="description" content="Mshin — colorful top-down arcade racing prototype">
<title>Mshin — Meadow Run</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#173d2c;touch-action:none}#game{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #183326}.top{position:absolute;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.pill{background:#173b2cdd;border:2px solid #ffffff55;border-radius:16px;padding:8px 13px;font-weight:800;box-shadow:0 4px 0 #10291e88}.stats{display:flex;gap:8px}.stat{min-width:74px;text-align:center}.stat small{display:block;font-size:10px;letter-spacing:1px;color:#d6f6cb}.stat b{font-size:19px}.brand{font-size:14px;letter-spacing:1px}.controls{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;display:flex;align-items:end;justify-content:space-between;padding:0 22px;pointer-events:none}.stick{width:118px;height:118px;border-radius:50%;background:#173b2c88;border:3px solid #ffffff99;position:relative;pointer-events:auto;touch-action:none;box-shadow:0 5px 0 #10291e66}.knob{position:absolute;width:48px;height:48px;border-radius:50%;left:32px;top:32px;background:linear-gradient(#fff,#b8e9a8);border:3px solid #397b45;box-shadow:0 3px 0 #245331}.pedals{display:flex;gap:12px;align-items:end;pointer-events:auto}.pedal{border:3px solid #ffffffaa;border-radius:22px;width:76px;height:82px;color:#fff;font-weight:900;font-size:13px;box-shadow:0 5px 0 #173b2c88;touch-action:none}.gas{background:linear-gradient(#ff9c3d,#e45a28)}.brake{background:linear-gradient(#8cb8ff,#3d68bd);height:68px}.pause{pointer-events:auto;border:2px solid #ffffff88;border-radius:12px;background:#173b2cdd;color:white;font-weight:900;padding:9px 13px}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#102b20a8;padding:20px}.panel{width:min(440px,94vw);background:linear-gradient(145deg,#fff8dc,#d9f3bd);color:#21442d;border:5px solid #fff;border-radius:28px;padding:24px;text-align:center;box-shadow:0 12px 0 #173b2c88}.panel h1{margin:0 0 6px;font-size:32px}.panel p{margin:8px 0 18px}.primary{border:0;border-radius:16px;padding:14px 26px;background:linear-gradient(#ffcf4b,#ff9636);color:#573316;font-weight:1000;font-size:17px;box-shadow:0 5px 0 #bd6828}.hidden{display:none}@media(orientation:portrait){.panel:after{content:"Rotate your device for the best racing view.";display:block;margin-top:12px;font-size:12px;color:#53704e}}
</style>
</head>
<body>
<canvas id="game" aria-label="Mshin top-down racing game"></canvas>
<div class="hud"><div class="top"><div class="pill"><div class="brand">🏁 MSHIN · MEADOW RUN</div><small>WORLD 01 / STAGE 01</small></div><div class="stats"><div class="pill stat"><small>TIME</small><b id="time">00:00</b></div><div class="pill stat"><small>LAP</small><b id="lap">0 / 3</b></div><div class="pill stat"><small>SPEED</small><b id="speed">0</b></div></div><button class="pause" id="pause">Ⅱ</button></div>
<div class="controls"><div class="stick" id="stick" aria-label="Steering joystick"><div class="knob" id="knob"></div></div><div class="pedals"><button class="pedal brake" id="brake">BRAKE</button><button class="pedal gas" id="gas">▲<br>GO!</button></div></div></div>
<div class="overlay" id="intro"><div class="panel"><h1>🌼 Meadow Run</h1><p>Welcome to Green Valley! Complete three laps, stay on the road and avoid the hay bales.</p><p><b>Steer</b> with the left joystick · <b>Accelerate</b> with GO · <b>Brake</b> to slow down.</p><button class="primary" id="start">START RACE ▶</button></div></div>
<div class="overlay hidden" id="result"><div class="panel"><h1 id="resultTitle">🏆 Finished!</h1><p id="resultText">Great driving!</p><button class="primary" id="again">RACE AGAIN ↻</button></div></div>
<script type="module" src="./src/game.js"></script>
</body></html>
