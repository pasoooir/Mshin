name: Mshin desktop and mobile browser smoke
on:
  push:
    branches: [main, "feat/**", "test/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local game server
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mshin-http.log 2>&1 &
          server_pid=$!
          echo "$server_pid" > /tmp/mshin-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              echo "Local game server is ready."
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/mshin-http.log
              exit 1
            fi
            sleep 1
          done
          echo "Local game server did not become ready."
          cat /tmp/mshin-http.log
          exit 1
      - name: Run desktop and mobile browser smoke tests
        run: |
          node --check tests/browser-smoke.mjs
          node tests/browser-smoke.mjs
      - name: Stop local game server
        if: always()
        run: |
          if [ -f /tmp/mshin-http.pid ]; then
            kill "$(cat /tmp/mshin-http.pid)" 2>/dev/null || true
          fi
      - name: Upload desktop and mobile gameplay previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mshin-gameplay-previews
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 7
