name: City roads zoning and traffic simulation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/city/**"
      - "tests/city-*.test.mjs"
      - ".github/workflows/city-roads-zoning-traffic.yml"
permissions:
  contents: read
concurrency:
  group: city-roads-zoning-traffic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  city-world:
    name: Road connectivity, zoning, growth and traffic regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Build isolated city core test fixtures
        run: npm run build:core
      - name: Validate city grid, placement and simulation
        run: node --test tests/city-core.test.mjs tests/city-view.test.mjs
      - name: Validate zoning and building growth
        run: node --test tests/city-zoning.test.mjs
      - name: Validate traffic AI foundation
        run: node --test tests/traffic-ai.test.mjs
      - name: Check city domain boundaries
        run: npm run check:architecture