name: Validate Mshin game data and portable TypeScript core
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, "feat/**", "test/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run validate:data
      - run: npm run build:core
      - run: npm run check:js-syntax
      - name: Audit Racing and City dependency boundaries
        run: npm run analyze:architecture
      - name: Validate workflow YAML syntax
        run: ruby -e 'require "yaml"; Dir.glob(".github/workflows/*.{yml,yaml}").each { |file| YAML.parse_file(file); puts "PASS " + file }'
      - run: npm run check:cocos-syntax
      - run: npm run check:worker
      - run: node --check src/physics.js
      - run: node --check src/game.js
      - run: node --check src/web-game.js
      - run: node --check src/race-renderer-3d.js
      - run: node --check src/audio.js
      - run: node --check src/asset-loader.js
      - run: npm test
