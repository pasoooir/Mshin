name: Validate Mshin game data and portable TypeScript core
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run validate:data
      - run: npm run build:core
      - run: npm run check:cocos-syntax
      - run: npm run check:worker
      - run: node --check src/physics.js
      - run: node --check src/game.js
      - run: node --check src/web-game.js
      - run: node --check src/menu-3d-scene.js
      - run: node --check src/audio.js
      - run: node --check src/asset-loader.js
      - run: npm test
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser smoke tests
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mshin-http.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null 2>&1; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Local HTTP server exited before becoming ready."
              cat /tmp/mshin-http.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Local HTTP server did not become ready on port 4173."
            cat /tmp/mshin-http.log
            exit 1
          fi
          node --check tests/browser-smoke.mjs
          node tests/browser-smoke.mjs
      - name: Upload desktop and mobile gameplay previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mshin-gameplay-previews
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 7
