name: Validate Mshin game data and portable TypeScript core
on:
  push:
    branches: [main, "feat/**", "test/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run validate:data
      - run: npm run build:core
      - run: npm run check:cocos-syntax
      - run: npm run check:worker
      - run: node --check src/physics.js
      - run: node --check src/game.js
      - run: node --check src/web-game.js
      - run: npm test
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser smoke tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mshin-http.log 2>&1 &
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node tests/browser-smoke.mjs
