name: Verify repository-local CC0 race textures

on:
  pull_request:
    paths:
      - "assets/textures/**"
      - "scripts/verify-race-textures.mjs"
      - "package.json"
      - ".github/workflows/race-texture-assets.yml"
  push:
    branches: [main]
    paths:
      - "assets/textures/**"
      - "scripts/verify-race-textures.mjs"
      - "package.json"
      - ".github/workflows/race-texture-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-local-textures:
    name: Verify committed CC0 texture files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify repository-local JPEG assets
        run: npm run assets:race-textures
