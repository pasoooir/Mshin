name: Mshin Cloudflare API

on:
  pull_request:
    paths:
      - "cloudflare-auth/**"
      - "server/src/market.mjs"
      - ".github/workflows/cloudflare-api.yml"
  push:
    branches: [main]
    paths:
      - "cloudflare-auth/**"
      - "server/src/market.mjs"
      - ".github/workflows/cloudflare-api.yml"

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Cloudflare API
        working-directory: cloudflare-auth
        run: npm test
      - name: Validate Wrangler configuration
        working-directory: cloudflare-auth
        run: npx --yes wrangler@4 deploy --dry-run


  deployed-smoke:
    needs: worker-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify deployed Worker health, CORS and login nonce endpoint
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://mshin-player-auth.pasoooir-erp.workers.dev';
          const origin = 'https://pasoooir.github.io';

          const gameResponse = await fetch(origin + '/Mshin/');
          if (!gameResponse.ok) throw new Error('GitHub Pages game is not reachable: HTTP ' + gameResponse.status);
          const launcher = await gameResponse.text();
          if (!/PLAY MSHIN/i.test(launcher)) throw new Error('GitHub Pages launcher is not the playable Mshin entrypoint');
          const latestResponse = await fetch(origin + '/Mshin/game/latest/index.html');
          if (!latestResponse.ok) throw new Error('Latest game build is not published: HTTP ' + latestResponse.status);
          const latestBuild = await latestResponse.text();
          if (!latestBuild.includes('location.replace') || !latestBuild.includes('../')) {
            throw new Error('Latest immutable game build pointer is invalid');
          }

          const health = await fetch(base + '/healthz', { headers: { Origin: origin } });
          if (!health.ok) throw new Error('Worker health failed: HTTP ' + health.status);
          const healthBody = await health.json();
          if (healthBody.ok !== true || healthBody.service !== 'mshin-cloudflare-json-api') {
            throw new Error('Unexpected Worker health payload');
          }
          if (health.headers.get('access-control-allow-origin') !== origin) {
            throw new Error('Worker health CORS origin mismatch');
          }

          const preflight = await fetch(base + '/v1/auth/nonce', {
            method: 'OPTIONS',
            headers: {
              Origin: origin,
              'Access-Control-Request-Method': 'GET',
              'Access-Control-Request-Headers': 'content-type'
            }
          });
          if (preflight.status !== 204 || preflight.headers.get('access-control-allow-origin') !== origin) {
            throw new Error('Worker CORS preflight failed: HTTP ' + preflight.status);
          }

          const nonceResponse = await fetch(base + '/v1/auth/nonce', { headers: { Origin: origin } });
          if (!nonceResponse.ok) throw new Error('Nonce endpoint failed: HTTP ' + nonceResponse.status);
          const nonceBody = await nonceResponse.json();
          if (typeof nonceBody.nonce !== 'string' || !/^[A-Za-z0-9_-]{40,60}$/.test(nonceBody.nonce) || nonceBody.expires_in !== 300) {
            throw new Error('Nonce endpoint returned an invalid challenge');
          }

          // Exercise the live Google-auth route without creating an identity:
          // malformed credentials must be rejected before D1 identity allocation.
          const invalidLogin = await fetch(base + '/v1/auth/google', {
            method: 'POST',
            headers: { Origin: origin, 'Content-Type': 'application/json' },
            body: JSON.stringify({ id_token: 'not-a-google-id-token', nonce: nonceBody.nonce })
          });
          const invalidLoginBody = await invalidLogin.json();
          if (invalidLogin.status !== 401 || invalidLoginBody.error !== 'invalid_id_token') {
            throw new Error('Google auth route did not reject a malformed ID token safely: HTTP ' + invalidLogin.status);
          }

          const unauthorizedProfile = await fetch(base + '/v1/profile', { headers: { Origin: origin } });
          const unauthorizedProfileBody = await unauthorizedProfile.json();
          if (unauthorizedProfile.status !== 401 || unauthorizedProfileBody.error !== 'unauthorized') {
            throw new Error('Profile API did not enforce a signed-in player session: HTTP ' + unauthorizedProfile.status);
          }

          const rejectedOrigin = await fetch(base + '/v1/auth/nonce', {
            headers: { Origin: 'https://mshin-untrusted-origin.example' }
          });
          if (rejectedOrigin.status !== 403) {
            throw new Error('Worker accepted an untrusted browser origin: HTTP ' + rejectedOrigin.status);
          }

          console.log('PASS: deployed Worker health, CORS, D1 nonce, malformed Google-token rejection, bearer-session gate and origin isolation');
          NODE
