name: Mshin Cloudflare API

on:
  pull_request:
    paths:
      - "cloudflare-auth/**"
      - "server/src/market.mjs"
      - ".github/workflows/cloudflare-api.yml"
  push:
    branches: [main]
    paths:
      - "cloudflare-auth/**"
      - "server/src/market.mjs"
      - ".github/workflows/cloudflare-api.yml"

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Cloudflare API
        working-directory: cloudflare-auth
        run: npm test
      - name: Validate Wrangler configuration
        working-directory: cloudflare-auth
        run: npx --yes wrangler@4 deploy --dry-run


  deployed-smoke:
    needs: worker-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify deployed Worker health, CORS and login nonce endpoint
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://mshin-player-auth.pasoooir-erp.workers.dev';
          const origin = 'https://pasoooir.github.io';

          const health = await fetch(base + '/healthz', { headers: { Origin: origin } });
          if (!health.ok) throw new Error('Worker health failed: HTTP ' + health.status);
          const healthBody = await health.json();
          if (healthBody.ok !== true || healthBody.service !== 'mshin-cloudflare-json-api') {
            throw new Error('Unexpected Worker health payload');
          }
          if (health.headers.get('access-control-allow-origin') !== origin) {
            throw new Error('Worker health CORS origin mismatch');
          }

          const preflight = await fetch(base + '/v1/auth/nonce', {
            method: 'OPTIONS',
            headers: {
              Origin: origin,
              'Access-Control-Request-Method': 'GET',
              'Access-Control-Request-Headers': 'content-type'
            }
          });
          if (preflight.status !== 204 || preflight.headers.get('access-control-allow-origin') !== origin) {
            throw new Error('Worker CORS preflight failed: HTTP ' + preflight.status);
          }

          const nonceResponse = await fetch(base + '/v1/auth/nonce', { headers: { Origin: origin } });
          if (!nonceResponse.ok) throw new Error('Nonce endpoint failed: HTTP ' + nonceResponse.status);
          const nonceBody = await nonceResponse.json();
          if (typeof nonceBody.nonce !== 'string' || !/^[A-Za-z0-9_-]{40,60}$/.test(nonceBody.nonce) || nonceBody.expires_in !== 300) {
            throw new Error('Nonce endpoint returned an invalid challenge');
          }
          console.log('PASS: deployed Worker health, CORS preflight and D1-backed login nonce endpoint');
          NODE
