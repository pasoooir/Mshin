name: City utilities and public-service impact
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/city/**"
      - "tests/city-services.test.mjs"
      - "tests/city-economy.test.mjs"
      - ".github/workflows/city-service-impact.yml"
permissions:
  contents: read
concurrency:
  group: city-service-impact-${{ github.ref }}
  cancel-in-progress: true
jobs:
  service-simulation:
    name: Utility coverage, civic services and economy regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Test utility and public-service coverage
        run: node --test tests/city-services.test.mjs
      - name: Test service upkeep and budget interactions
        run: node --test tests/city-economy.test.mjs
      - name: Report remaining acceptance scope
        run: |
          echo "Current coverage and deterministic service/economy regressions passed."
          echo "Richer demand, capacity saturation, citizen-level access and measurable satisfaction response still require dedicated implementation and acceptance tests."