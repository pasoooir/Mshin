name: City employment and job-demand readiness
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/city/**"
      - "tests/city-*.test.mjs"
      - ".github/workflows/city-employment-demand.yml"
permissions:
  contents: read
concurrency:
  group: city-employment-demand-${{ github.ref }}
  cancel-in-progress: true
jobs:
  population-regression:
    name: Population baseline and employment-slice regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Validate city core and population behavior
        run: node --test tests/city-core.test.mjs tests/city-population.test.mjs
      - name: Record outstanding employment acceptance gap
        run: |
          echo "Population regression passed."
          echo "IMPORTANT: full resident-to-workplace matching, commute assignment, vacancies and job-demand feedback are not yet implemented/accepted by this workflow."
          echo "This workflow is a manual regression gate, not evidence that job matching is complete."