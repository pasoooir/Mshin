name: City employment and job-demand readiness
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/city/**"
      - "tests/city-*.test.mjs"
      - ".github/workflows/city-employment-demand.yml"
permissions:
  contents: read
concurrency:
  group: city-employment-demand-${{ github.ref }}
  cancel-in-progress: true
jobs:
  population-regression:
    name: Population baseline and employment-slice regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Compile portable city core test fixtures
        run: npm run build:core
      - name: Validate city core and population behavior
        run: node --test tests/city-core.test.mjs tests/city-population.test.mjs tests/city-employment.test.mjs tests/city-commuting.test.mjs
      - name: Report verified employment acceptance scope
        run: |
          echo "Employment regression passed."
          echo "Verified: sector workplace capacity, deterministic aggregate workforce matching, unemployment, vacancies and labor-demand metrics."
          echo "Verified: road-network commute assignment, disconnected-road handling, commute coverage and congestion-aware commute metrics."
          echo "Not covered by this aggregate model: individual employment contracts, wages, shifts or worker-specific schedules."
          echo "Playwright/browser and physical-device acceptance remain separate gates."
