name: Vendor runtime assets for Mshin 0.9.3

on:
  push:
    branches:
      - release/0.9.3-self-hosted-assets
    paths:
      - .github/workflows/vendor-runtime-assets.yml

permissions:
  contents: write

concurrency:
  group: mshin-vendor-runtime-assets
  cancel-in-progress: false

jobs:
  vendor-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/0.9.3-self-hosted-assets
          fetch-depth: 0
      - name: Vendor all external runtime assets
        run: node scripts/vendor-runtime-assets.mjs
      - name: Commit repository-local assets and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cdn/assets src/asset-manifest.json assets/resources/vector-art.json package.json manifest.webmanifest index.html service-worker.js docs/VENDORED_ASSETS.md
          git commit -m "chore(assets): vendor runtime CDN assets for 0.9.3"
          git push origin HEAD:release/0.9.3-self-hosted-assets
