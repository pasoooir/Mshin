name: Convert icon SVG assets to PNG

on:
  push:
    paths:
      - "godot-city-buildit/assets/icons/**/*.svg"
      - "godot-city-buildit/tools/convert_icons_to_png.py"
      - ".github/workflows/convert-icon-assets.yml"
  pull_request:
    paths:
      - "godot-city-buildit/assets/icons/**/*.svg"
      - "godot-city-buildit/tools/convert_icons_to_png.py"
      - ".github/workflows/convert-icon-assets.yml"

permissions:
  contents: write

jobs:
  convert:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SVG rasterizer
        run: |
          python -m pip install --upgrade pip
          python -m pip install CairoSVG
      - name: Convert SVG icon files and migrate references
        run: python godot-city-buildit/tools/convert_icons_to_png.py
      - name: Commit generated PNG assets
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add godot-city-buildit/assets/icons godot-city-buildit
          git commit -m "assets: convert icon library to high-resolution PNG"
          git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
