name: Validate and rasterize city texture sources

on:
  pull_request:
    paths:
      - "assets/city/textures/**"
      - "tools/rasterize-city-textures.py"
      - ".github/workflows/city-texture-assets.yml"
  push:
    branches: [main]
    paths:
      - "assets/city/textures/**"
      - "tools/rasterize-city-textures.py"
      - ".github/workflows/city-texture-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rasterize:
    name: Rasterize procedural city textures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare isolated Python environment
        run: |
          python3 -m venv .texture-venv
          .texture-venv/bin/python -m pip install --disable-pip-version-check pillow cairosvg

      - name: Generate PNG textures
        run: .texture-venv/bin/python tools/rasterize-city-textures.py --size 512

      - name: Verify generated texture outputs
        run: |
          .texture-venv/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path("assets/city/textures/generated")
          expected = {"grass", "asphalt", "sidewalk", "brick", "concrete", "roof"}
          actual = {p.stem for p in root.glob("*.png")}
          if actual != expected:
              raise SystemExit(f"Texture set mismatch: expected={sorted(expected)}, actual={sorted(actual)}")
          for path in sorted(root.glob("*.png")):
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  if image.size != (512, 512) or image.mode not in {"RGB", "RGBA"}:
                      raise SystemExit(f"Invalid texture {path}: {image.size}, {image.mode}")
              print(f"OK {path}")
          PY

      - name: Upload generated texture preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: mshin-city-textures-512
          path: assets/city/textures/generated/*.png
          if-no-files-found: error
          retention-days: 14

  publish-runtime-textures:
    name: Publish generated Cocos runtime textures
    needs: rasterize
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download validated texture outputs
        uses: actions/download-artifact@v4
        with:
          name: mshin-city-textures-512
          path: assets/city/textures/generated

      - name: Commit runtime-ready PNG assets when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p assets/resources/city/textures/generated
          cp assets/city/textures/generated/*.png assets/resources/city/textures/generated/
          git add assets/city/textures/generated/*.png assets/resources/city/textures/generated/*.png
          if git diff --cached --quiet; then
            echo "Generated texture assets are already up to date."
            exit 0
          fi
          git commit -m "assets(city): publish generated runtime textures"
          git push origin "HEAD:${GITHUB_REF_NAME}"
