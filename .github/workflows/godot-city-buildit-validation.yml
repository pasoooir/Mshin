name: Godot City BuildIt Validation

on:
  push:
    branches: [main]
    paths:
      - "godot-city-buildit/**"
      - ".github/workflows/godot-city-buildit-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "godot-city-buildit/**"
      - ".github/workflows/godot-city-buildit-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Static project validation
        run: python godot-city-buildit/tools/validate_project.py

      - name: Validate transparent PNG icon catalog
        run: python godot-city-buildit/tools/validate_icon_assets.py

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Verify Godot version
        run: godot --version

      - name: Import and parse project
        run: godot --headless --path godot-city-buildit --editor --quit

      - name: Headless startup smoke test
        run: |
          set -o pipefail
          godot --headless --path godot-city-buildit --quit-after 10 2>&1 | tee /tmp/godot-startup.log
          if grep -q "SCRIPT ERROR" /tmp/godot-startup.log; then exit 1; fi

      - name: End-to-end gameplay integration test
        run: |
          set -o pipefail
          timeout 90s godot --headless --path godot-city-buildit res://tests/gameplay_smoke.tscn 2>&1 | tee /tmp/godot-gameplay.log
          if grep -q "SCRIPT ERROR" /tmp/godot-gameplay.log; then exit 1; fi
          if grep -q "ERROR: [GameplaySmoke]" /tmp/godot-gameplay.log; then exit 1; fi
          grep -F "[GameplaySmoke] PASS" /tmp/godot-gameplay.log

      - name: Responsive UI viewport matrix
        run: |
          set -o pipefail
          for viewport in 854x480 1024x768 1920x1080; do
            log="/tmp/godot-responsive-${viewport}.log"
            echo "Running responsive UI acceptance at ${viewport}"
            timeout 90s godot --headless --path godot-city-buildit --windowed --resolution "${viewport}" res://tests/gameplay_smoke.tscn 2>&1 | tee "${log}"
            if grep -q "SCRIPT ERROR" "${log}"; then exit 1; fi
            if grep -q "ERROR: [GameplaySmoke]" "${log}"; then exit 1; fi
            grep -F "[GameplaySmoke] PASS" "${log}"
          done
