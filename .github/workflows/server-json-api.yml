name: Server JSON API

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-json-api.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server-json-api.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run JSON API and marketplace tests
        working-directory: server
        run: npm test
