name: Mshin Playable Web

# Always rebuild Pages on main pushes. Path filters previously allowed the
# documentation/README fallback to remain published after the playable site
# workflow was skipped; deployment is the source of truth for the public game.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "godot-city-buildit/**"
      - "Intro.jpg"
      - ".github/workflows/mshin-playable-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Isolate pull-request validation from the main Pages publisher and from
  # other PRs. Only a newer run for the same PR (or main) may supersede it.
  # A global group cancels unrelated mobile/desktop browser acceptance jobs.
  group: github-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4.3 and Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Install custom boot splash image
        run: |
          test -s Intro.jpg
          cp Intro.jpg godot-city-buildit/Intro.jpg

      - name: Validate project structure
        run: python godot-city-buildit/tools/validate_project.py

      - name: Import and parse project
        run: godot --headless --editor --path godot-city-buildit --import

      - name: Headless startup smoke test
        run: |
          set -o pipefail
          godot --headless --path godot-city-buildit --quit-after 10 2>&1 | tee /tmp/godot-startup.log
          if grep -q "SCRIPT ERROR" /tmp/godot-startup.log; then exit 1; fi

      - name: Gameplay integration test
        run: |
          set -o pipefail
          timeout 90s godot --headless --path godot-city-buildit res://tests/gameplay_smoke.tscn 2>&1 | tee /tmp/godot-gameplay.log
          if grep -q "SCRIPT ERROR" /tmp/godot-gameplay.log; then exit 1; fi
          if grep -Fq "ERROR: [GameplaySmoke]" /tmp/godot-gameplay.log; then exit 1; fi
          grep -F "[GameplaySmoke] PASS" /tmp/godot-gameplay.log

      - name: Export Godot game for browsers
        run: |
          VERSIONED_GAME_DIR="$GITHUB_WORKSPACE/site/game/$GITHUB_SHA"
          mkdir -p "$VERSIONED_GAME_DIR"
          godot --headless --path godot-city-buildit --export-release "Web" "$VERSIONED_GAME_DIR/index.html"
          test -s "$VERSIONED_GAME_DIR/index.html"
          test -s "$VERSIONED_GAME_DIR/index.png"
          cp godot-city-buildit/Intro.jpg "$VERSIONED_GAME_DIR/Intro.jpg"
          cmp Intro.jpg "$VERSIONED_GAME_DIR/Intro.jpg"
          grep -Fq 'src="Intro.jpg"' "$VERSIONED_GAME_DIR/index.html"
          grep -Fq 'Mshin loading screen' "$VERSIONED_GAME_DIR/index.html"
          grep -Fq 'progress-fill' "$VERSIONED_GAME_DIR/index.html"
          grep -Fq 'object-fit: cover' "$VERSIONED_GAME_DIR/index.html"
          grep -Fq 'onProgress(current, total)' "$VERSIONED_GAME_DIR/index.html"
          if grep -Fq 'Godot Game engine' "$VERSIONED_GAME_DIR/index.html"; then
            echo "Default Godot loading shell unexpectedly exported."
            exit 1
          fi
          # Launch the immutable build directory, not the mutable /latest/
          # alias. Android browsers and GitHub Pages can retain cached PCK/JS
          # assets under a stable URL; a SHA URL guarantees a new game payload
          # after every deployment.
          mkdir -p "$GITHUB_WORKSPACE/site/game/latest"
          cat > "$GITHUB_WORKSPACE/site/game/latest/index.html" <<EOF
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="robots" content="noindex"><meta http-equiv="refresh" content="0; url=../$GITHUB_SHA/"><title>Opening latest Mshin build</title></head>
          <body><p>Opening latest Mshin build… <a href="../$GITHUB_SHA/">Continue</a></p><script>location.replace("../$GITHUB_SHA/" + location.search + location.hash);</script></body>
          </html>
          EOF
          cp godot-city-buildit/web/launcher.html "$GITHUB_WORKSPACE/site/index.html"
          sed -i "s|__GAME_BUILD__|$GITHUB_SHA|g" "$GITHUB_WORKSPACE/site/index.html"
          grep -Fq "./game/$GITHUB_SHA/" "$GITHUB_WORKSPACE/site/index.html"
          grep -Fq "../$GITHUB_SHA/" "$GITHUB_WORKSPACE/site/game/latest/index.html"
          if grep -Fq "__GAME_BUILD__" "$GITHUB_WORKSPACE/site/index.html"; then exit 1; fi
          touch "$GITHUB_WORKSPACE/site/.nojekyll"

      - name: Verify desktop and mobile Web launches in Chromium
        run: |
          npm install --no-save playwright
          # GitHub-hosted runners already include Chromium's shared system libraries.
          # Avoid apt-based --with-deps: transient Ubuntu mirror outages must not
          # block the browser smoke test after the game has already exported.
          npx playwright install chromium
          python3 -m http.server 4173 --directory site >/tmp/mshin-web-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          mkdir -p artifacts/visual-acceptance
          timeout 120s node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const browser = await chromium.launch({ headless: true, timeout: 30000, args: ['--no-sandbox', '--disable-dev-shm-usage', '--use-gl=angle', '--use-angle=swiftshader'] });
          const page = await browser.newPage({ viewport: { width: 1280, height: 720 }, deviceScaleFactor: 1, hasTouch: true });
          const errors = [];
          page.on('pageerror', error => errors.push(error.message));
          page.on('crash', () => console.log('[desktop diagnostics] page crashed'));
          page.on('close', () => console.log('[desktop diagnostics] page closed'));
          page.on('console', message => console.log('[desktop console:' + message.type() + '] ' + message.text()));
          page.on('requestfailed', request => console.log('[desktop request failed] ' + request.url() + ' ' + (request.failure()?.errorText ?? 'unknown')));
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 10000 });
          await page.getByRole('button', { name: /PLAY MSHIN/i }).click();
          const gameFrame = page.locator('#game-frame');
          await gameFrame.waitFor({ state: 'attached', timeout: 10000 });
          const desktopFramePermissions = (await gameFrame.getAttribute('allow') || '').split(';').map(value => value.trim());
          if (!desktopFramePermissions.includes('identity-credentials-get')) {
            throw new Error('Desktop game iframe must delegate Google FedCM identity-credentials-get permission');
          }
          try {
            await page.frameLocator('#game-frame').locator('canvas').waitFor({ state: 'visible', timeout: 90000 });
          } catch (error) {
            console.log('[desktop diagnostics] iframe=' + await gameFrame.getAttribute('src'));
            console.log('[desktop diagnostics] frames=' + page.frames().map(frame => frame.url()).join(' | '));
            console.log('[desktop diagnostics] page errors=' + errors.join(' | '));
            throw error;
          }
          // Godot's exported canvas backing-store width can legitimately be
          // zero while the WebGL context is being initialized. The acceptance
          // gate is the actual visible iframe viewport, not the backing-store
          // attribute. Read its browser-computed box through Playwright's
          // protocol instead of evaluating JavaScript inside the WebGL frame.
          const frameBounds = await gameFrame.boundingBox();
          const canvasWidth = Math.round(frameBounds?.width ?? 0);
          const canvasHeight = Math.round(frameBounds?.height ?? 0);
          if (canvasWidth < 640 || canvasHeight < 360) {
            throw new Error('Desktop game viewport display size is too small: ' + canvasWidth + 'x' + canvasHeight);
          }
          // The launcher delegates fullscreen to the game after the user click.
          // Exit it before changing the emulated viewport; Chromium refuses
          // setViewportSize while a page owns the fullscreen window.
          await page.evaluate(async () => {
            if (document.fullscreenElement) await document.exitFullscreen();
          });
          // Reuse one WebGL instance for desktop and mobile dimensions. Starting
          // a second software-rendered Godot context on the same runner exhausts
          // compositor resources and makes page teardown block indefinitely.
          await page.setViewportSize({ width: 844, height: 390 });
          await page.waitForTimeout(500);
          const mobileCanvas = page.frameLocator('#game-frame').locator('canvas');
          const canvasBounds = await mobileCanvas.boundingBox();
          if (!canvasBounds || canvasBounds.width < 320 || canvasBounds.height < 180) {
            throw new Error('Mobile canvas bounds are unavailable or too small for touch acceptance');
          }
          const touchSession = await page.context().newCDPSession(page);
          const centerX = canvasBounds.x + canvasBounds.width * 0.5;
          const centerY = canvasBounds.y + canvasBounds.height * 0.52;
          const touch = (id, x, y) => ({ id, x: Math.round(x), y: Math.round(y), radiusX: 8, radiusY: 8, force: 1 });

          await touchSession.send('Input.dispatchTouchEvent', {
            type: 'touchStart',
            touchPoints: [touch(1, centerX - 42, centerY), touch(2, centerX + 42, centerY)]
          });
          await touchSession.send('Input.dispatchTouchEvent', {
            type: 'touchMove',
            touchPoints: [touch(1, centerX - 68, centerY), touch(2, centerX + 68, centerY)]
          });
          await touchSession.send('Input.dispatchTouchEvent', {
            type: 'touchMove',
            touchPoints: [touch(1, centerX - 48, centerY + 24), touch(2, centerX + 88, centerY + 24)]
          });
          await touchSession.send('Input.dispatchTouchEvent', {
            type: 'touchMove',
            touchPoints: [touch(1, centerX - 48, centerY - 44), touch(2, centerX + 48, centerY + 44)]
          });
          await touchSession.send('Input.dispatchTouchEvent', { type: 'touchEnd', touchPoints: [] });
          await touchSession.send('Input.dispatchTouchEvent', {
            type: 'touchStart',
            touchPoints: [touch(3, centerX, centerY)]
          });
          await touchSession.send('Input.dispatchTouchEvent', {
            type: 'touchMove',
            touchPoints: [touch(3, centerX + 36, centerY + 22)]
          });
          await touchSession.send('Input.dispatchTouchEvent', { type: 'touchEnd', touchPoints: [] });
          await touchSession.detach();
          await page.waitForTimeout(250);
          if (!(await mobileCanvas.isVisible())) {
            throw new Error('Game canvas became hidden after single- and multi-touch gestures');
          }
          if (errors.length) {
            throw new Error('Browser page errors: ' + errors.join(' | '));
          }
          await writeFile('artifacts/visual-acceptance/metadata.json', JSON.stringify({
            build: process.env.GITHUB_SHA,
            desktopViewport: { width: 1280, height: 720, deviceScaleFactor: 1 },
            mobileViewport: { width: 844, height: 390, hasTouch: true },
            desktopCanvas: { width: canvasWidth, height: canvasHeight },
            mobileCanvas: { width: Math.round(canvasBounds.width), height: Math.round(canvasBounds.height) },
            captures: [],
            interactions: ['desktop WebGL Compatibility launch', 'mobile landscape viewport', 'two-finger pinch', 'two-finger pan', 'two-finger twist', 'one-finger pan'],
            note: 'One live Godot WebGL instance is tested at desktop and mobile landscape dimensions. Software-WebGL pixel readback is intentionally excluded because it blocks Chromium on hosted runners.'
          }, null, 2));
          await browser.close();
          NODE
      - name: Upload real WebGL visual acceptance captures
        uses: actions/upload-artifact@v4
        with:
          name: mshin-webgl-browser-acceptance-${{ github.sha }}
          path: artifacts/visual-acceptance/
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy game to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
