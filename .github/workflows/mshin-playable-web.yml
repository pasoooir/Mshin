name: Mshin Playable Web

on:
  push:
    branches: [main, feat/simcity-iconic-hud]
    paths:
      - "godot-city-buildit/**"
      - "Intro.jpg"
      - ".github/workflows/mshin-playable-web.yml"
  pull_request:
    branches: [main]
    paths:
      - "godot-city-buildit/**"
      - "Intro.jpg"
      - ".github/workflows/mshin-playable-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4.3 and Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Install custom boot splash image
        run: |
          test -s Intro.jpg
          cp Intro.jpg godot-city-buildit/Intro.jpg

      - name: Validate project structure
        run: python godot-city-buildit/tools/validate_project.py

      - name: Import and parse project
        run: godot --headless --editor --path godot-city-buildit --quit

      - name: Headless startup smoke test
        run: |
          set -o pipefail
          godot --headless --path godot-city-buildit --quit-after 10 2>&1 | tee /tmp/godot-startup.log
          if grep -q "SCRIPT ERROR" /tmp/godot-startup.log; then exit 1; fi

      - name: Gameplay integration test
        run: |
          set -o pipefail
          timeout 90s godot --headless --path godot-city-buildit res://tests/gameplay_smoke.tscn 2>&1 | tee /tmp/godot-gameplay.log
          if grep -q "SCRIPT ERROR" /tmp/godot-gameplay.log; then exit 1; fi
          if grep -Fq "ERROR: [GameplaySmoke]" /tmp/godot-gameplay.log; then exit 1; fi
          grep -F "[GameplaySmoke] PASS" /tmp/godot-gameplay.log

      - name: Export Godot game for browsers
        run: |
          VERSIONED_GAME_DIR="$GITHUB_WORKSPACE/site/game/$GITHUB_SHA"
          mkdir -p "$VERSIONED_GAME_DIR"
          godot --headless --path godot-city-buildit --export-release "Web" "$VERSIONED_GAME_DIR/index.html"
          test -s "$VERSIONED_GAME_DIR/index.html"
          test -s "$VERSIONED_GAME_DIR/index.png"
          cp godot-city-buildit/Intro.jpg "$VERSIONED_GAME_DIR/Intro.jpg"
          cmp Intro.jpg "$VERSIONED_GAME_DIR/Intro.jpg"
          grep -Fq 'src="Intro.jpg"' "$VERSIONED_GAME_DIR/index.html"
          grep -Fq 'Mshin loading screen' "$VERSIONED_GAME_DIR/index.html"
          grep -Fq 'progress-fill' "$VERSIONED_GAME_DIR/index.html"
          grep -Fq 'object-fit: cover' "$VERSIONED_GAME_DIR/index.html"
          grep -Fq 'onProgress(current, total)' "$VERSIONED_GAME_DIR/index.html"
          if grep -Fq 'Godot Game engine' "$VERSIONED_GAME_DIR/index.html"; then
            echo "Default Godot loading shell unexpectedly exported."
            exit 1
          fi
          cp godot-city-buildit/web/launcher.html "$GITHUB_WORKSPACE/site/index.html"
          sed -i "s|__GAME_BUILD__|$GITHUB_SHA|g" "$GITHUB_WORKSPACE/site/index.html"
          grep -Fq "./game/$GITHUB_SHA/" "$GITHUB_WORKSPACE/site/index.html"
          if grep -Fq "__GAME_BUILD__" "$GITHUB_WORKSPACE/site/index.html"; then exit 1; fi
          touch "$GITHUB_WORKSPACE/site/.nojekyll"

      - name: Verify desktop and mobile Web launches in Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory site >/tmp/mshin-web-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 720 }, deviceScaleFactor: 1 });
          const errors = [];
          page.on('pageerror', error => errors.push(error.message));
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 10000 });
          await page.getByRole('button', { name: /PLAY MSHIN/i }).click();
          const gameFrame = page.locator('#game-frame');
          await gameFrame.waitFor({ state: 'attached', timeout: 10000 });
          await page.frameLocator('#game-frame').locator('canvas').waitFor({ state: 'visible', timeout: 10000 });
          await page.waitForTimeout(2000);

          // Repeat the real launch path in a touch-enabled mobile landscape viewport.
          const mobilePage = await browser.newPage({
            viewport: { width: 844, height: 390 },
            deviceScaleFactor: 1,
            isMobile: true,
            hasTouch: true
          });
          const mobileErrors = [];
          mobilePage.on('pageerror', error => mobileErrors.push(error.message));
          await mobilePage.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 10000 });
          await mobilePage.getByRole('button', { name: /PLAY MSHIN/i }).click();
          const mobileFrame = mobilePage.locator('#game-frame');
          await mobileFrame.waitFor({ state: 'attached', timeout: 10000 });
          await mobilePage.frameLocator('#game-frame').locator('canvas').waitFor({ state: 'visible', timeout: 10000 });
          // The mobile acceptance gate is functional (launcher + live canvas);
          // avoid a second WebGL screenshot because software-rendered mobile
          // emulation can stall Chromium's compositor.
          await mobilePage.waitForTimeout(2000);

          if (errors.length || mobileErrors.length) {
            throw new Error('Browser page errors: ' + [...errors, ...mobileErrors].join(' | '));
          }
          await browser.close();
          NODE
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy game to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
