name: Mshin Playable Web

# Always rebuild Pages on main pushes. Path filters previously allowed the
# documentation/README fallback to remain published after the playable site
# workflow was skipped; deployment is the source of truth for the public game.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "godot-city-buildit/**"
      - "Intro.jpg"
      - ".github/workflows/mshin-playable-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Isolate pull-request validation from the main Pages publisher and from
  # other PRs. Only a newer run for the same PR (or main) may supersede it.
  # A global group cancels unrelated mobile/desktop browser acceptance jobs.
  group: github-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4.3 and Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Install custom boot splash image
        run: |
          test -s Intro.jpg
          cp Intro.jpg godot-city-buildit/Intro.jpg

      - name: Validate project structure
        run: python godot-city-buildit/tools/validate_project.py

      - name: Import and parse project
        run: godot --headless --editor --path godot-city-buildit --import

      - name: Headless startup smoke test
        run: |
          set -o pipefail
          godot --headless --path godot-city-buildit --quit-after 10 2>&1 | tee /tmp/godot-startup.log
          if grep -q "SCRIPT ERROR" /tmp/godot-startup.log; then exit 1; fi

      - name: Gameplay integration test
        run: |
          set -o pipefail
          timeout 90s godot --headless --path godot-city-buildit res://tests/gameplay_smoke.tscn 2>&1 | tee /tmp/godot-gameplay.log
          if grep -q "SCRIPT ERROR" /tmp/godot-gameplay.log; then exit 1; fi
          if grep -Fq "ERROR: [GameplaySmoke]" /tmp/godot-gameplay.log; then exit 1; fi
          grep -F "[GameplaySmoke] PASS" /tmp/godot-gameplay.log

      - name: Export Godot game for browsers
        run: |
          VERSIONED_GAME_DIR="$GITHUB_WORKSPACE/site/game/$GITHUB_SHA"
          mkdir -p "$VERSIONED_GAME_DIR"
          godot --headless --path godot-city-buildit --export-release "Web" "$VERSIONED_GAME_DIR/index.html"
          test -s "$VERSIONED_GAME_DIR/index.html"
          test -s "$VERSIONED_GAME_DIR/index.png"
          cp godot-city-buildit/Intro.jpg "$VERSIONED_GAME_DIR/Intro.jpg"
          cmp Intro.jpg "$VERSIONED_GAME_DIR/Intro.jpg"
          grep -Fq 'src="Intro.jpg"' "$VERSIONED_GAME_DIR/index.html"
          grep -Fq 'Mshin loading screen' "$VERSIONED_GAME_DIR/index.html"
          grep -Fq 'progress-fill' "$VERSIONED_GAME_DIR/index.html"
          grep -Fq 'object-fit: cover' "$VERSIONED_GAME_DIR/index.html"
          grep -Fq 'onProgress(current, total)' "$VERSIONED_GAME_DIR/index.html"
          if grep -Fq 'Godot Game engine' "$VERSIONED_GAME_DIR/index.html"; then
            echo "Default Godot loading shell unexpectedly exported."
            exit 1
          fi
          # Launch the immutable build directory, not the mutable /latest/
          # alias. Android browsers and GitHub Pages can retain cached PCK/JS
          # assets under a stable URL; a SHA URL guarantees a new game payload
          # after every deployment.
          mkdir -p "$GITHUB_WORKSPACE/site/game/latest"
          cat > "$GITHUB_WORKSPACE/site/game/latest/index.html" <<EOF
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="robots" content="noindex"><meta http-equiv="refresh" content="0; url=../$GITHUB_SHA/"><title>Opening latest Mshin build</title></head>
          <body><p>Opening latest Mshin build… <a href="../$GITHUB_SHA/">Continue</a></p><script>location.replace("../$GITHUB_SHA/" + location.search + location.hash);</script></body>
          </html>
          EOF
          cp godot-city-buildit/web/launcher.html "$GITHUB_WORKSPACE/site/index.html"
          sed -i "s|__GAME_BUILD__|$GITHUB_SHA|g" "$GITHUB_WORKSPACE/site/index.html"
          grep -Fq "./game/$GITHUB_SHA/" "$GITHUB_WORKSPACE/site/index.html"
          grep -Fq "../$GITHUB_SHA/" "$GITHUB_WORKSPACE/site/game/latest/index.html"
          if grep -Fq "__GAME_BUILD__" "$GITHUB_WORKSPACE/site/index.html"; then exit 1; fi
          touch "$GITHUB_WORKSPACE/site/.nojekyll"

      - name: Verify mobile landscape WebGL launch and touch controls in Chromium
        run: |
          # Bound package/browser setup as well as the test itself: network
          # stalls must not leave the mobile visual gate running indefinitely.
          timeout 120s npm install --no-save playwright
          # GitHub-hosted runners already include Chromium's shared system libraries.
          # Avoid apt-based --with-deps: transient Ubuntu mirror outages must not
          # block the browser smoke test after the game has already exported.
          timeout 120s npx playwright install chromium
          python3 -m http.server 4173 --directory site >/tmp/mshin-web-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          mkdir -p artifacts/visual-acceptance
          timeout 240s node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const browser = await chromium.launch({ headless: true, timeout: 30000, args: ['--no-sandbox', '--disable-dev-shm-usage', '--use-gl=angle', '--use-angle=swiftshader'] });
          const page = await browser.newPage({ viewport: { width: 844, height: 390 }, deviceScaleFactor: 1, hasTouch: true });
          // Preserve the WebGL drawing buffer so Chromium can export the actual
          // game canvas directly. page.screenshot() invokes SwiftShader's
          // compositor readback and can hang for 30s on hosted Linux runners.
          await page.addInitScript(() => {
            const originalGetContext = HTMLCanvasElement.prototype.getContext;
            HTMLCanvasElement.prototype.getContext = function(type, options) {
              if (type === 'webgl2' || type === 'webgl' || type === 'experimental-webgl') {
                options = { ...(options || {}), preserveDrawingBuffer: true };
              }
              return originalGetContext.call(this, type, options);
            };
            // Deterministic fake GIS only in the CI top-level page. It exercises
            // the real iframe/launcher message boundary without a real Gmail user.
            if (window.top === window) {
              let authConfig = null;
              window.google = { accounts: { id: {
                initialize(config) { authConfig = config; },
                renderButton(target) {
                  const button = document.createElement('button');
                  button.type = 'button';
                  button.textContent = 'Continue with Google (CI)';
                  button.addEventListener('click', () => authConfig?.callback?.({ credential: 'synthetic-google-id-token' }));
                  target.appendChild(button);
                },
                prompt(callback) { callback({ isNotDisplayed: () => true, isSkippedMoment: () => false }); }
              } } };
            }
          });
          const errors = [];
          page.on('pageerror', error => errors.push(error.message));
          page.on('crash', () => console.log('[desktop diagnostics] page crashed'));
          page.on('close', () => console.log('[desktop diagnostics] page closed'));
          page.on('console', message => console.log('[desktop console:' + message.type() + '] ' + message.text()));
          page.on('requestfailed', request => console.log('[desktop request failed] ' + request.url() + ' ' + (request.failure()?.errorText ?? 'unknown')));
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 10000 });
          await page.getByRole('button', { name: /PLAY MSHIN/i }).click();
          const gameFrame = page.locator('#game-frame');
          await gameFrame.waitFor({ state: 'attached', timeout: 10000 });
          const desktopFramePermissions = (await gameFrame.getAttribute('allow') || '').split(';').map(value => value.trim());
          if (!desktopFramePermissions.includes('identity-credentials-get')) {
            throw new Error('Desktop game iframe must delegate Google FedCM identity-credentials-get permission');
          }
          try {
            await page.frameLocator('#game-frame').locator('canvas').waitFor({ state: 'visible', timeout: 90000 });
          } catch (error) {
            console.log('[desktop diagnostics] iframe=' + await gameFrame.getAttribute('src'));
            console.log('[desktop diagnostics] frames=' + page.frames().map(frame => frame.url()).join(' | '));
            console.log('[desktop diagnostics] page errors=' + errors.join(' | '));
            throw error;
          }
          // The page stays in its actual mobile landscape viewport from launch;
          // the game may own fullscreen after the Play button is pressed.
          const mobileCanvas = page.frameLocator('#game-frame').locator('canvas');
          // Prove the actual top-level Google bridge returns a credential only
          // to the requesting same-origin game iframe.
          const bridgeNonce = 'A'.repeat(43);
          await page.evaluate(() => {
            const frame = document.getElementById('game-frame');
            window.__mshinGoogleBridgeDiagnostics = { topOrigin: location.origin, googleReady: !!window.google?.accounts?.id, iframeOrigin: frame?.contentWindow?.location?.origin || null, requests: [] };
            window.addEventListener('message', event => {
              if (event.data?.type === 'mshin-google-auth-request') {
                window.__mshinGoogleBridgeDiagnostics.requests.push({ sourceMatches: event.source === frame.contentWindow, origin: event.origin, expectedOrigin: location.origin, clientId: event.data.clientId, nonceLength: String(event.data.nonce || '').length });
              }
            });
          });
          await mobileCanvas.evaluate((canvas, nonce) => {
            window.__mshinGoogleBridgeResult = null;
            const receive = event => {
              if (event.source !== window.parent || event.origin !== window.location.origin) return;
              if (!event.data || event.data.type !== 'mshin-google-auth-response' || event.data.nonce !== nonce) return;
              window.removeEventListener('message', receive);
              window.__mshinGoogleBridgeResult = event.data;
            };
            window.addEventListener('message', receive);
            window.parent.postMessage({
              type: 'mshin-google-auth-request',
              clientId: '437590540762-utd1hbi5pcgvhl7p5u36ivmj9il7q9sm.apps.googleusercontent.com',
              nonce,
              autoSelect: false
            }, window.location.origin);
          }, bridgeNonce);
          const bridgeSurface = await page.evaluate(() => {
            const frame = document.getElementById('game-frame');
            const doc = frame?.contentDocument;
            const overlay = doc?.getElementById('mshin-google-signin-overlay');
            const button = doc?.querySelector('#mshin-google-render-button button');
            if (!overlay || !button) return { overlay: !!overlay, button: !!button };
            const rect = button.getBoundingClientRect();
            const hit = doc.elementFromPoint(rect.left + rect.width / 2, rect.top + rect.height / 2);
            const pointerHitsGoogleButton = !!hit && (hit === button || button.contains(hit));
            const pointerHitsOverlay = !!hit && overlay.contains(hit);
            if (pointerHitsGoogleButton) button.click();
            return { overlay: true, button: true, width: rect.width, height: rect.height, pointerHitsGoogleButton, pointerHitsOverlay, hitTag: hit?.tagName || null };
          });
          if (!bridgeSurface.overlay || !bridgeSurface.button || !bridgeSurface.pointerHitsGoogleButton || !bridgeSurface.pointerHitsOverlay) {
            throw new Error('Google sign-in control is not the topmost tappable surface inside the fullscreen game: ' + JSON.stringify(bridgeSurface));
          }
          await page.waitForFunction(() => {
            const frame = document.getElementById('game-frame');
            const response = frame?.contentWindow?.__mshinGoogleBridgeResult;
            return response?.credential === 'synthetic-google-id-token';
          }, null, { timeout: 5000 });
          const bridgeResponse = await mobileCanvas.evaluate(() => window.__mshinGoogleBridgeResult);
          if (!bridgeResponse || bridgeResponse.credential !== 'synthetic-google-id-token' || bridgeResponse.nonce !== bridgeNonce) {
            const diagnostics = await page.evaluate(() => window.__mshinGoogleBridgeDiagnostics);
            throw new Error('Top-level Google sign-in bridge did not return the nonce-bound credential to the game iframe: ' + JSON.stringify({ bridgeResponse, diagnostics }));
          }
          const canvasBounds = await mobileCanvas.boundingBox();
          if (!canvasBounds || canvasBounds.width < 320 || canvasBounds.height < 180) {
            throw new Error('Mobile landscape canvas bounds are unavailable or too small for touch acceptance');
          }
          // Export the live WebGL canvas itself instead of asking Chromium's
          // software compositor to screenshot the entire page. The preserved
          // drawing buffer makes this deterministic on SwiftShader CI runners.
          const captures = [];
          const capture = async path => {
            const dataUrl = await mobileCanvas.evaluate(canvas => canvas.toDataURL('image/png'));
            if (!dataUrl.startsWith('data:image/png;base64,')) {
              throw new Error('WebGL canvas did not return a PNG data URL');
            }
            const png = Buffer.from(dataUrl.slice('data:image/png;base64,'.length), 'base64');
            if (png.length < 4096 || png.readUInt32BE(16) < 320 || png.readUInt32BE(20) < 180) {
              throw new Error('WebGL canvas capture is empty or below the mobile acceptance resolution');
            }
            await writeFile(path, png);
            captures.push(path.split('/').pop());
            console.log('[visual capture saved] ' + path + ' (' + png.length + ' bytes)');
          };
          await capture('artifacts/visual-acceptance/01-overview.png');
          const touchSession = await page.context().newCDPSession(page);
          const centerX = canvasBounds.x + canvasBounds.width * 0.5;
          const centerY = canvasBounds.y + canvasBounds.height * 0.52;
          const touch = (id, x, y) => ({ id, x: Math.round(x), y: Math.round(y), radiusX: 8, radiusY: 8, force: 1 });

          await touchSession.send('Input.dispatchTouchEvent', {
            type: 'touchStart',
            touchPoints: [touch(1, centerX - 42, centerY), touch(2, centerX + 42, centerY)]
          });
          await touchSession.send('Input.dispatchTouchEvent', {
            type: 'touchMove',
            touchPoints: [touch(1, centerX - 68, centerY), touch(2, centerX + 68, centerY)]
          });
          await touchSession.send('Input.dispatchTouchEvent', {
            type: 'touchMove',
            touchPoints: [touch(1, centerX - 48, centerY + 24), touch(2, centerX + 88, centerY + 24)]
          });
          await touchSession.send('Input.dispatchTouchEvent', {
            type: 'touchMove',
            touchPoints: [touch(1, centerX - 48, centerY - 44), touch(2, centerX + 48, centerY + 44)]
          });
          await touchSession.send('Input.dispatchTouchEvent', { type: 'touchEnd', touchPoints: [] });
          await page.waitForTimeout(350);
          await capture('artifacts/visual-acceptance/02-near-zoom.png');
          // Reverse pinch to capture the medium/overview transition.
          await touchSession.send('Input.dispatchTouchEvent', {
            type: 'touchStart',
            touchPoints: [touch(4, centerX - 78, centerY), touch(5, centerX + 78, centerY)]
          });
          await touchSession.send('Input.dispatchTouchEvent', {
            type: 'touchMove',
            touchPoints: [touch(4, centerX - 36, centerY), touch(5, centerX + 36, centerY)]
          });
          await touchSession.send('Input.dispatchTouchEvent', { type: 'touchEnd', touchPoints: [] });
          await page.waitForTimeout(350);
          await capture('artifacts/visual-acceptance/03-medium-zoom.png');
          await touchSession.send('Input.dispatchTouchEvent', {
            type: 'touchStart',
            touchPoints: [touch(3, centerX, centerY)]
          });
          await touchSession.send('Input.dispatchTouchEvent', {
            type: 'touchMove',
            touchPoints: [touch(3, centerX + 36, centerY + 22)]
          });
          await touchSession.send('Input.dispatchTouchEvent', { type: 'touchEnd', touchPoints: [] });
          await touchSession.detach();
          await page.waitForTimeout(250);
          if (!(await mobileCanvas.isVisible())) {
            throw new Error('Game canvas became hidden after single- and multi-touch gestures');
          }
          if (errors.length) {
            throw new Error('Browser page errors: ' + errors.join(' | '));
          }
          await writeFile('artifacts/visual-acceptance/metadata.json', JSON.stringify({
            build: process.env.GITHUB_SHA,
            viewport: { width: 844, height: 390, deviceScaleFactor: 1, hasTouch: true },
            canvas: { width: Math.round(canvasBounds.width), height: Math.round(canvasBounds.height) },
            captures,
            interactions: ['mobile landscape Godot WebGL Compatibility launch', 'two-finger pinch', 'two-finger pan', 'two-finger twist', 'one-finger pan'],
            note: 'PNG evidence is exported from the preserved live WebGL canvas at the real 844x390 mobile landscape viewport.'

          }, null, 2));
          if (captures.length !== 3) {
            throw new Error('Visual acceptance requires all overview, near-zoom and medium-zoom PNG captures; received ' + captures.length);
          }
          await browser.close();
          NODE
      - name: Upload real WebGL visual acceptance captures
        uses: actions/upload-artifact@v4
        with:
          name: mshin-webgl-browser-acceptance-${{ github.sha }}
          path: artifacts/visual-acceptance/
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy game to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
