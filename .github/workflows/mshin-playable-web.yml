name: Mshin Playable Web

# Always rebuild Pages on main pushes. Path filters previously allowed the
# documentation/README fallback to remain published after the playable site
# workflow was skipped; deployment is the source of truth for the public game.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "godot-city-buildit/**"
      - "Intro.jpg"
      - ".github/workflows/mshin-playable-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Isolate pull-request validation from the main Pages publisher and from
  # other PRs. Only a newer run for the same PR (or main) may supersede it.
  # A global group cancels unrelated mobile/desktop browser acceptance jobs.
  group: github-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4.3 and Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Install custom boot splash image
        run: |
          test -s Intro.jpg
          cp Intro.jpg godot-city-buildit/Intro.jpg

      - name: Validate project structure
        run: python godot-city-buildit/tools/validate_project.py

      - name: Import and parse project
        run: godot --headless --editor --path godot-city-buildit --import

      - name: Headless startup smoke test
        run: |
          set -o pipefail
          godot --headless --path godot-city-buildit --quit-after 10 2>&1 | tee /tmp/godot-startup.log
          if grep -q "SCRIPT ERROR" /tmp/godot-startup.log; then exit 1; fi

      - name: Gameplay integration test
        run: |
          set -o pipefail
          timeout 90s godot --headless --path godot-city-buildit res://tests/gameplay_smoke.tscn 2>&1 | tee /tmp/godot-gameplay.log
          if grep -q "SCRIPT ERROR" /tmp/godot-gameplay.log; then exit 1; fi
          if grep -Fq "ERROR: [GameplaySmoke]" /tmp/godot-gameplay.log; then exit 1; fi
          grep -F "[GameplaySmoke] PASS" /tmp/godot-gameplay.log

      - name: Export Godot game for browsers
        run: |
          VERSIONED_GAME_DIR="$GITHUB_WORKSPACE/site/game/$GITHUB_SHA"
          mkdir -p "$VERSIONED_GAME_DIR"
          godot --headless --path godot-city-buildit --export-release "Web" "$VERSIONED_GAME_DIR/index.html"
          test -s "$VERSIONED_GAME_DIR/index.html"
          test -s "$VERSIONED_GAME_DIR/index.png"
          cp godot-city-buildit/Intro.jpg "$VERSIONED_GAME_DIR/Intro.jpg"
          cmp Intro.jpg "$VERSIONED_GAME_DIR/Intro.jpg"
          grep -Fq 'src="Intro.jpg"' "$VERSIONED_GAME_DIR/index.html"
          grep -Fq 'Mshin loading screen' "$VERSIONED_GAME_DIR/index.html"
          grep -Fq 'progress-fill' "$VERSIONED_GAME_DIR/index.html"
          grep -Fq 'object-fit: cover' "$VERSIONED_GAME_DIR/index.html"
          grep -Fq 'onProgress(current, total)' "$VERSIONED_GAME_DIR/index.html"
          if grep -Fq 'Godot Game engine' "$VERSIONED_GAME_DIR/index.html"; then
            echo "Default Godot loading shell unexpectedly exported."
            exit 1
          fi
          # Launch the immutable build directory, not the mutable /latest/
          # alias. Android browsers and GitHub Pages can retain cached PCK/JS
          # assets under a stable URL; a SHA URL guarantees a new game payload
          # after every deployment.
          mkdir -p "$GITHUB_WORKSPACE/site/game/latest"
          cat > "$GITHUB_WORKSPACE/site/game/latest/index.html" <<EOF
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="robots" content="noindex"><meta http-equiv="refresh" content="0; url=../$GITHUB_SHA/"><title>Opening latest Mshin build</title></head>
          <body><p>Opening latest Mshin build… <a href="../$GITHUB_SHA/">Continue</a></p><script>location.replace("../$GITHUB_SHA/" + location.search + location.hash);</script></body>
          </html>
          EOF
          cp godot-city-buildit/web/launcher.html "$GITHUB_WORKSPACE/site/index.html"
          sed -i "s|__GAME_BUILD__|$GITHUB_SHA|g" "$GITHUB_WORKSPACE/site/index.html"
          grep -Fq "./game/$GITHUB_SHA/" "$GITHUB_WORKSPACE/site/index.html"
          grep -Fq "../$GITHUB_SHA/" "$GITHUB_WORKSPACE/site/game/latest/index.html"
          if grep -Fq "__GAME_BUILD__" "$GITHUB_WORKSPACE/site/index.html"; then exit 1; fi
          touch "$GITHUB_WORKSPACE/site/.nojekyll"

      - name: Verify desktop and mobile Web launches in Chromium
        run: |
          npm install --no-save playwright
          # GitHub-hosted runners already include Chromium's shared system libraries.
          # Avoid apt-based --with-deps: transient Ubuntu mirror outages must not
          # block the browser smoke test after the game has already exported.
          npx playwright install chromium
          python3 -m http.server 4173 --directory site >/tmp/mshin-web-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          mkdir -p artifacts/visual-acceptance
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 720 }, deviceScaleFactor: 1 });
          const errors = [];
          page.on('pageerror', error => errors.push(error.message));
          page.on('crash', () => console.log('[desktop diagnostics] page crashed'));
          page.on('close', () => console.log('[desktop diagnostics] page closed'));
          page.on('console', message => console.log('[desktop console:' + message.type() + '] ' + message.text()));
          page.on('requestfailed', request => console.log('[desktop request failed] ' + request.url() + ' ' + (request.failure()?.errorText ?? 'unknown')));
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 10000 });
          await page.getByRole('button', { name: /PLAY MSHIN/i }).click();
          const gameFrame = page.locator('#game-frame');
          await gameFrame.waitFor({ state: 'attached', timeout: 10000 });
          const desktopFramePermissions = (await gameFrame.getAttribute('allow') || '').split(';').map(value => value.trim());
          if (!desktopFramePermissions.includes('identity-credentials-get')) {
            throw new Error('Desktop game iframe must delegate Google FedCM identity-credentials-get permission');
          }
          try {
            await page.frameLocator('#game-frame').locator('canvas').waitFor({ state: 'visible', timeout: 20000 });
          } catch (error) {
            console.log('[desktop diagnostics] iframe=' + await gameFrame.getAttribute('src'));
            console.log('[desktop diagnostics] frames=' + page.frames().map(frame => frame.url()).join(' | '));
            console.log('[desktop diagnostics] page errors=' + errors.join(' | '));
            throw error;
          }
          // Godot's exported canvas backing-store width can legitimately be
          // zero while the WebGL context is being initialized. The acceptance
          // gate is the actual visible iframe viewport, not the backing-store
          // attribute. Read its browser-computed box through Playwright's
          // protocol instead of evaluating JavaScript inside the WebGL frame.
          const frameBounds = await gameFrame.boundingBox();
          const canvasWidth = Math.round(frameBounds?.width ?? 0);
          const canvasHeight = Math.round(frameBounds?.height ?? 0);
          if (canvasWidth < 640 || canvasHeight < 360) {
            throw new Error('Desktop game viewport display size is too small: ' + canvasWidth + 'x' + canvasHeight);
          }
          await page.screenshot({
            path: 'artifacts/visual-acceptance/desktop-pacific-entry.png',
            animations: 'disabled',
            timeout: 60000
          });
          // The Godot canvas fills the 1280x720 game viewport. Move the pointer
          // directly instead of asking Playwright to calculate its bounding box.
          await page.mouse.move(640, 360);
          // Pull back slightly from the opening overview to frame the wide beach,
          // timber promenade, palms and inland green edge together.
          for (let i = 0; i < 10; i++) await page.mouse.wheel(0, -100);
          await page.waitForTimeout(1000);
          await page.screenshot({
            path: 'artifacts/visual-acceptance/desktop-pacific-medium.png',
            animations: 'disabled',
            timeout: 60000
          });
          // Move closer to inspect the beach texture, palm geometry and promenade.
          for (let i = 0; i < 22; i++) await page.mouse.wheel(0, -100);
          await page.waitForTimeout(1200);
          await page.screenshot({
            path: 'artifacts/visual-acceptance/desktop-pacific-near.png',
            animations: 'disabled',
            timeout: 60000
          });
          // Return to a wide coastal overview with the city and Pacific edge in view.
          for (let i = 0; i < 20; i++) await page.mouse.wheel(0, 100);
          await page.waitForTimeout(1400);
          await page.screenshot({
            path: 'artifacts/visual-acceptance/desktop-pacific-overview.png',
            animations: 'disabled',
            timeout: 60000
          });

          // Exercise every viewport in the responsive UI acceptance standard.
          // Resize the same running WebGL scene. Validate both the browser CSS viewport
          // and the actual PNG dimensions; iframe bounds alone can pass while the
          // screenshot is still captured at the original 1280x720 window size.
          const responsiveProfiles = [
            { name: 'compact-854x480', width: 854, height: 480 },
            { name: 'compact-960x540', width: 960, height: 540 },
            { name: 'tablet-1024x768', width: 1024, height: 768 },
            { name: 'tablet-1280x800', width: 1280, height: 800 },
            { name: 'desktop-1366x768', width: 1366, height: 768 },
            { name: 'desktop-1536x864', width: 1536, height: 864 },
            { name: 'desktop-1920x1080', width: 1920, height: 1080 }
          ];
          const responsiveCaptureNames = [];
          const responsiveCaptureDetails = [];
          // Godot requests fullscreen after PLAY. Chromium rejects
          // Browser.setWindowBounds/Playwright viewport resizing while the
          // top-level window is fullscreen or maximized. Restore the browser
          // window to its normal state before applying each real viewport size.
          // This is a test-harness transition only; the game remains running.
          const desktopWindowSession = await page.context().newCDPSession(page);
          const { windowId: desktopWindowId } = await desktopWindowSession.send('Browser.getWindowForTarget');
          await desktopWindowSession.send('Browser.setWindowBounds', {
            windowId: desktopWindowId,
            bounds: { windowState: 'normal' }
          });
          await desktopWindowSession.detach();
          await page.waitForTimeout(150);

          // Validate CSS viewport, iframe bounds and PNG IHDR dimensions for every profile.
          for (const profile of responsiveProfiles) {
            await page.setViewportSize({ width: profile.width, height: profile.height });
            await page.waitForTimeout(350);
            const actualViewport = await page.evaluate(() => ({
              width: window.innerWidth,
              height: window.innerHeight,
              devicePixelRatio: window.devicePixelRatio
            }));
            if (actualViewport.width !== profile.width || actualViewport.height !== profile.height) {
              throw new Error('Browser CSS viewport did not adopt ' + profile.name +
                ': ' + JSON.stringify(actualViewport));
            }
            const bounds = await gameFrame.boundingBox();
            if (!bounds ||
                Math.abs(bounds.width - profile.width) > 2 ||
                Math.abs(bounds.height - profile.height) > 2) {
              throw new Error('Game iframe did not fill responsive viewport ' + profile.name +
                ': ' + JSON.stringify(bounds));
            }
            const canvasVisible = await page.frameLocator('#game-frame').locator('canvas').isVisible();
            if (!canvasVisible) {
              throw new Error('Godot canvas became hidden at responsive viewport ' + profile.name);
            }
            const captureName = 'responsive-' + profile.name + '.png';
            const screenshotBuffer = await page.screenshot({
              path: 'artifacts/visual-acceptance/' + captureName,
              scale: 'css',
              animations: 'disabled',
              timeout: 60000
            });
            const screenshotSize = {
              width: screenshotBuffer.readUInt32BE(16),
              height: screenshotBuffer.readUInt32BE(20)
            };
            if (screenshotSize.width !== profile.width || screenshotSize.height !== profile.height) {
              throw new Error('Screenshot PNG dimensions do not match ' + profile.name +
                ': ' + JSON.stringify(screenshotSize));
            }
            responsiveCaptureNames.push(captureName);
            responsiveCaptureDetails.push({
              name: profile.name,
              expected: { width: profile.width, height: profile.height },
              actualViewport,
              iframe: bounds,
              screenshot: screenshotSize
            });
          }
          await page.setViewportSize({ width: 1280, height: 720 });
          await page.waitForTimeout(250);
          await writeFile('artifacts/visual-acceptance/metadata.json', JSON.stringify({
            build: process.env.GITHUB_SHA,
            viewport: { width: 1280, height: 720, deviceScaleFactor: 1 },
            canvas: { width: canvasWidth, height: canvasHeight },
            captures: ['desktop-pacific-entry.png', 'desktop-pacific-medium.png', 'desktop-pacific-near.png', 'desktop-pacific-overview.png', ...responsiveCaptureNames],
            responsiveProfiles,
            responsiveCaptureDetails,
            zoomInteraction: 'Godot mouse wheel: 10 steps to medium, 22 additional steps to near, 20 steps out',
            note: 'Each capture is accepted only when CSS viewport, iframe bounds and PNG dimensions all match the target profile. This still does not prove zero HUD clipping or physical-device safe-area behavior.'
          }, null, 2));
          // Release the desktop WebGL context before starting the mobile viewport.
          await page.close();

          // Repeat the real launch path in a touch-enabled mobile landscape viewport.
          const mobilePage = await browser.newPage({
            viewport: { width: 844, height: 390 },
            deviceScaleFactor: 1,
            hasTouch: true
          });
          const mobileErrors = [];
          mobilePage.on('pageerror', error => mobileErrors.push(error.message));
          mobilePage.on('console', message => console.log('[mobile console:' + message.type() + '] ' + message.text()));
          mobilePage.on('requestfailed', request => console.log('[mobile request failed] ' + request.url() + ' ' + (request.failure()?.errorText ?? 'unknown')));
          await mobilePage.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 10000 });
          await mobilePage.getByRole('button', { name: /PLAY MSHIN/i }).click();
          const mobileFrame = mobilePage.locator('#game-frame');
          await mobileFrame.waitFor({ state: 'attached', timeout: 10000 });
          const mobileFramePermissions = (await mobileFrame.getAttribute('allow') || '').split(';').map(value => value.trim());
          if (!mobileFramePermissions.includes('identity-credentials-get')) {
            throw new Error('Mobile game iframe must delegate Google FedCM identity-credentials-get permission');
          }
          await mobilePage.frameLocator('#game-frame').locator('canvas').waitFor({ state: 'visible', timeout: 20000 });
          // The mobile acceptance gate is functional (launcher + live canvas);
          // avoid a second WebGL screenshot because software-rendered mobile
          // emulation can stall Chromium's compositor.
          await mobilePage.waitForTimeout(2000);

          // Exercise the actual browser touch-event path against the embedded
          // Godot canvas. CDP dispatches touch points at page coordinates, so
          // this covers iframe routing and the browser's multi-pointer input
          // delivery (Godot GameplaySmoke remains the camera-math assertion).
          const mobileCanvas = mobilePage.frameLocator('#game-frame').locator('canvas');
          const canvasBounds = await mobileCanvas.boundingBox();
          if (!canvasBounds || canvasBounds.width < 320 || canvasBounds.height < 180) {
            throw new Error('Mobile canvas bounds are unavailable or too small for touch acceptance');
          }
          const touchSession = await mobilePage.context().newCDPSession(mobilePage);
          const centerX = canvasBounds.x + canvasBounds.width * 0.5;
          const centerY = canvasBounds.y + canvasBounds.height * 0.52;
          const touch = (id, x, y) => ({ id, x: Math.round(x), y: Math.round(y), radiusX: 8, radiusY: 8, force: 1 });

          // Two-finger pinch-out: increase separation around a stable centroid.
          await touchSession.send('Input.dispatchTouchEvent', {
            type: 'touchStart',
            touchPoints: [touch(1, centerX - 42, centerY), touch(2, centerX + 42, centerY)]
          });
          await touchSession.send('Input.dispatchTouchEvent', {
            type: 'touchMove',
            touchPoints: [touch(1, centerX - 68, centerY), touch(2, centerX + 68, centerY)]
          });
          // Two-finger pan: translate both contacts without changing separation.
          await touchSession.send('Input.dispatchTouchEvent', {
            type: 'touchMove',
            touchPoints: [touch(1, centerX - 48, centerY + 24), touch(2, centerX + 88, centerY + 24)]
          });
          // Two-finger twist: rotate the pair around its midpoint.
          await touchSession.send('Input.dispatchTouchEvent', {
            type: 'touchMove',
            touchPoints: [touch(1, centerX - 48, centerY - 44), touch(2, centerX + 48, centerY + 44)]
          });
          await touchSession.send('Input.dispatchTouchEvent', { type: 'touchEnd', touchPoints: [] });

          // Confirm a clean two-to-one transition followed by a fresh one-finger pan.
          await touchSession.send('Input.dispatchTouchEvent', {
            type: 'touchStart',
            touchPoints: [touch(3, centerX, centerY)]
          });
          await touchSession.send('Input.dispatchTouchEvent', {
            type: 'touchMove',
            touchPoints: [touch(3, centerX + 36, centerY + 22)]
          });
          await touchSession.send('Input.dispatchTouchEvent', { type: 'touchEnd', touchPoints: [] });
          await touchSession.detach();
          await mobilePage.waitForTimeout(500);
          if (!(await mobileCanvas.isVisible())) {
            throw new Error('Mobile canvas became hidden after single- and multi-touch gestures');
          }

          // Portrait is a graceful fallback when a browser refuses orientation
          // lock. The game must remain visible, then recover on landscape return.
          const orientationSession = await mobilePage.context().newCDPSession(mobilePage);
          await orientationSession.send('Emulation.setDeviceMetricsOverride', {
            width: 390,
            height: 844,
            deviceScaleFactor: 1,
            mobile: true,
            screenWidth: 390,
            screenHeight: 844,
            screenOrientation: { type: 'portraitPrimary', angle: 0 }
          });
          await mobilePage.waitForTimeout(500);
          const portraitViewport = await mobilePage.evaluate(() => ({
            width: window.innerWidth,
            height: window.innerHeight
          }));
          const portraitBounds = await mobileFrame.boundingBox();
          if (portraitViewport.width !== 390 || portraitViewport.height !== 844 ||
              !portraitBounds || portraitBounds.width < 320 || portraitBounds.height < 700 ||
              !(await mobileCanvas.isVisible())) {
            throw new Error('Portrait fallback lost the requested browser viewport or live game canvas: ' +
              JSON.stringify({ portraitViewport, portraitBounds }));
          }
          await orientationSession.send('Emulation.setDeviceMetricsOverride', {
            width: 844,
            height: 390,
            deviceScaleFactor: 1,
            mobile: true,
            screenWidth: 844,
            screenHeight: 390,
            screenOrientation: { type: 'landscapePrimary', angle: 90 }
          });
          await mobilePage.waitForTimeout(500);
          const landscapeReturnViewport = await mobilePage.evaluate(() => ({
            width: window.innerWidth,
            height: window.innerHeight
          }));
          const landscapeReturnBounds = await mobileFrame.boundingBox();
          if (landscapeReturnViewport.width !== 844 || landscapeReturnViewport.height !== 390 ||
              !landscapeReturnBounds || landscapeReturnBounds.width < 800 ||
              landscapeReturnBounds.height < 360 || !(await mobileCanvas.isVisible())) {
            throw new Error('Returning to mobile landscape did not restore the requested viewport and live game canvas: ' +
              JSON.stringify({ landscapeReturnViewport, landscapeReturnBounds }));
          }
          await writeFile('artifacts/visual-acceptance/mobile-orientation-resize.json', JSON.stringify({
            portrait: { viewport: portraitViewport, frame: portraitBounds },
            landscapeReturn: { viewport: landscapeReturnViewport, frame: landscapeReturnBounds },
            result: 'browser viewport and canvas remained correct through portrait fallback and landscape return',
            note: 'Browser viewport resize test; not a physical Android orientation-lock test.'
          }, null, 2));
          await orientationSession.send('Emulation.clearDeviceMetricsOverride');
          await orientationSession.detach();

          if (errors.length || mobileErrors.length) {
            throw new Error('Browser page errors: ' + [...errors, ...mobileErrors].join(' | '));
          }
          await browser.close();
          NODE
      - name: Upload real WebGL visual acceptance captures
        uses: actions/upload-artifact@v4
        with:
          name: mshin-webgl-visual-acceptance-${{ github.sha }}
          path: artifacts/visual-acceptance/
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy game to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
