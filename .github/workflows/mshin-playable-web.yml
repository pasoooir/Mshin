name: Mshin Playable Web

# Always rebuild Pages on main pushes. Path filters previously allowed the
# documentation/README fallback to remain published after the playable site
# workflow was skipped; deployment is the source of truth for the public game.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "godot-city-buildit/**"
      - "Intro.jpg"
      - ".github/workflows/mshin-playable-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Isolate pull-request validation from the main Pages publisher and from
  # other PRs. Only a newer run for the same PR (or main) may supersede it.
  # A global group cancels unrelated mobile/desktop browser acceptance jobs.
  group: github-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4.3 and Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Install custom boot splash image
        run: |
          test -s Intro.jpg
          cp Intro.jpg godot-city-buildit/Intro.jpg

      - name: Validate project structure
        run: python godot-city-buildit/tools/validate_project.py

      - name: Import and parse project
        run: godot --headless --editor --path godot-city-buildit --import

      - name: Headless startup smoke test
        run: |
          set -o pipefail
          godot --headless --path godot-city-buildit --quit-after 10 2>&1 | tee /tmp/godot-startup.log
          if grep -q "SCRIPT ERROR" /tmp/godot-startup.log; then exit 1; fi

      - name: Gameplay integration test
        run: |
          set -o pipefail
          timeout 90s godot --headless --path godot-city-buildit res://tests/gameplay_smoke.tscn 2>&1 | tee /tmp/godot-gameplay.log
          if grep -q "SCRIPT ERROR" /tmp/godot-gameplay.log; then exit 1; fi
          if grep -Fq "ERROR: [GameplaySmoke]" /tmp/godot-gameplay.log; then exit 1; fi
          grep -F "[GameplaySmoke] PASS" /tmp/godot-gameplay.log

      - name: Export Godot game for browsers
        run: |
          VERSIONED_GAME_DIR="$GITHUB_WORKSPACE/site/game/$GITHUB_SHA"
          mkdir -p "$VERSIONED_GAME_DIR"
          godot --headless --path godot-city-buildit --export-release "Web" "$VERSIONED_GAME_DIR/index.html"
          test -s "$VERSIONED_GAME_DIR/index.html"
          test -s "$VERSIONED_GAME_DIR/index.png"
          cp godot-city-buildit/Intro.jpg "$VERSIONED_GAME_DIR/Intro.jpg"
          cmp Intro.jpg "$VERSIONED_GAME_DIR/Intro.jpg"
          grep -Fq 'src="Intro.jpg"' "$VERSIONED_GAME_DIR/index.html"
          grep -Fq 'Mshin loading screen' "$VERSIONED_GAME_DIR/index.html"
          grep -Fq 'progress-fill' "$VERSIONED_GAME_DIR/index.html"
          grep -Fq 'object-fit: cover' "$VERSIONED_GAME_DIR/index.html"
          grep -Fq 'onProgress(current, total)' "$VERSIONED_GAME_DIR/index.html"
          if grep -Fq 'Godot Game engine' "$VERSIONED_GAME_DIR/index.html"; then
            echo "Default Godot loading shell unexpectedly exported."
            exit 1
          fi
          # Launch the immutable build directory, not the mutable /latest/
          # alias. Android browsers and GitHub Pages can retain cached PCK/JS
          # assets under a stable URL; a SHA URL guarantees a new game payload
          # after every deployment.
          mkdir -p "$GITHUB_WORKSPACE/site/game/latest"
          cat > "$GITHUB_WORKSPACE/site/game/latest/index.html" <<EOF
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="robots" content="noindex"><meta http-equiv="refresh" content="0; url=../$GITHUB_SHA/"><title>Opening latest Mshin build</title></head>
          <body><p>Opening latest Mshin build… <a href="../$GITHUB_SHA/">Continue</a></p><script>location.replace("../$GITHUB_SHA/" + location.search + location.hash);</script></body>
          </html>
          EOF
          cp godot-city-buildit/web/launcher.html "$GITHUB_WORKSPACE/site/index.html"
          sed -i "s|__GAME_BUILD__|$GITHUB_SHA|g" "$GITHUB_WORKSPACE/site/index.html"
          grep -Fq "./game/$GITHUB_SHA/" "$GITHUB_WORKSPACE/site/index.html"
          grep -Fq "../$GITHUB_SHA/" "$GITHUB_WORKSPACE/site/game/latest/index.html"
          if grep -Fq "__GAME_BUILD__" "$GITHUB_WORKSPACE/site/index.html"; then exit 1; fi
          touch "$GITHUB_WORKSPACE/site/.nojekyll"

      - name: Verify desktop and mobile Web launches in Chromium
        run: |
          npm install --no-save playwright
          # GitHub-hosted runners already include Chromium's shared system libraries.
          # Avoid apt-based --with-deps: transient Ubuntu mirror outages must not
          # block the browser smoke test after the game has already exported.
          npx playwright install chromium
          python3 -m http.server 4173 --directory site >/tmp/mshin-web-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          mkdir -p artifacts/visual-acceptance
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 720 }, deviceScaleFactor: 1 });
          const errors = [];
          page.on('pageerror', error => errors.push(error.message));
          page.on('crash', () => console.log('[desktop diagnostics] page crashed'));
          page.on('close', () => console.log('[desktop diagnostics] page closed'));
          page.on('console', message => console.log('[desktop console:' + message.type() + '] ' + message.text()));
          page.on('requestfailed', request => console.log('[desktop request failed] ' + request.url() + ' ' + (request.failure()?.errorText ?? 'unknown')));
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 10000 });
          await page.getByRole('button', { name: /PLAY MSHIN/i }).click();
          const gameFrame = page.locator('#game-frame');
          await gameFrame.waitFor({ state: 'attached', timeout: 10000 });
          const desktopFramePermissions = (await gameFrame.getAttribute('allow') || '').split(';').map(value => value.trim());
          if (!desktopFramePermissions.includes('identity-credentials-get')) {
            throw new Error('Desktop game iframe must delegate Google FedCM identity-credentials-get permission');
          }
          try {
            await page.frameLocator('#game-frame').locator('canvas').waitFor({ state: 'visible', timeout: 20000 });
          } catch (error) {
            console.log('[desktop diagnostics] iframe=' + await gameFrame.getAttribute('src'));
            console.log('[desktop diagnostics] frames=' + page.frames().map(frame => frame.url()).join(' | '));
            console.log('[desktop diagnostics] page errors=' + errors.join(' | '));
            throw error;
          }
          const gameCanvas = page.frameLocator('#game-frame').locator('canvas');
          // Read the exported canvas backing dimensions from DOM attributes.
          // Avoid page-side evaluate/clientWidth: under software WebGL the
          // renderer can stall the iframe main thread after startup, causing
          // an otherwise healthy visible canvas to time out during evaluation.
          await page.waitForTimeout(1200);
          const canvasWidthAttribute = Number(await gameCanvas.getAttribute('width'));
          const canvasHeight = Number(await gameCanvas.getAttribute('height'));
          // Godot's canvas backing-width attribute may be zero while its
          // responsive iframe is already laid out. Measure the outer iframe
          // in the parent document (not the potentially stalled WebGL frame).
          const iframeDisplayWidth = Math.round(await gameFrame.evaluate(frame => frame.getBoundingClientRect().width));
          const canvasWidth = Math.max(canvasWidthAttribute, iframeDisplayWidth);
          if (canvasWidth < 640 || canvasHeight < 360) {
            throw new Error('Desktop WebGL display size is too small: ' + canvasWidth + 'x' + canvasHeight + ' (canvas attribute ' + canvasWidthAttribute + ')');
          }
          // Allow the optional Poly Haven CDN textures to arrive before the
          // first visual acceptance frame; procedural fallbacks remain valid.
          await page.waitForTimeout(1500);
          await page.screenshot({
            path: 'artifacts/visual-acceptance/desktop-entry.png',
            animations: 'disabled',
            timeout: 60000
          });
          // The Godot canvas fills the 1280x720 game viewport. Move the pointer
          // directly instead of asking Playwright to calculate its bounding box.
          async function captureCameraPreset(preset, filename) {
            const currentSrc = await gameFrame.getAttribute('src');
            const targetUrl = new URL(currentSrc, 'http://127.0.0.1:4173/');
            targetUrl.searchParams.set('visual_camera', preset);
            const navigated = page.waitForEvent('framenavigated', frame => frame.url().includes('visual_camera=' + preset), { timeout: 20000 });
            await gameFrame.evaluate((frame, src) => { frame.src = src; }, targetUrl.toString());
            await navigated;
            await page.frameLocator('#game-frame').locator('canvas').waitFor({ state: 'visible', timeout: 20000 });
            await page.waitForTimeout(1500);
            await page.screenshot({
              path: 'artifacts/visual-acceptance/' + filename,
              animations: 'disabled',
              timeout: 60000
            });
          }

          // Reload once per area, then use ordinary zoom input for the near view.
          // This keeps the smoke test deterministic without synthetic camera drags.
          async function captureNearView(filename) {
            await page.mouse.move(640, 360);
            for (let i = 0; i < 8; i++) await page.mouse.wheel(0, -100);
            await page.waitForTimeout(900);
            await page.screenshot({
              path: 'artifacts/visual-acceptance/' + filename,
              animations: 'disabled',
              timeout: 60000
            });
          }

          await captureCameraPreset('coast_far', 'desktop-coast-far.png');
          await captureNearView('desktop-coast-near.png');
          await captureCameraPreset('asphalt_far', 'desktop-asphalt-far.png');
          await captureNearView('desktop-asphalt-near.png');
          await captureCameraPreset('tunnel_far', 'desktop-tunnel-far.png');
          await captureNearView('desktop-tunnel-near.png');

          await writeFile('artifacts/visual-acceptance/metadata.json', JSON.stringify({
            build: process.env.GITHUB_SHA,
            viewport: { width: 1280, height: 720, deviceScaleFactor: 1 },
            canvas: { width: canvasWidth, height: canvasHeight },
            captures: ['desktop-entry.png', 'desktop-coast-far.png', 'desktop-coast-near.png', 'desktop-asphalt-far.png', 'desktop-asphalt-near.png', 'desktop-tunnel-far.png', 'desktop-tunnel-near.png'],
            zoomInteraction: 'Deterministic WebGL QA camera presets per area, with normal wheel zoom for the matching near views',
            note: 'Desktop WebGL canvas captures are real rendered game frames. Coastline, deep/shallow water, asphalt and tunnel are captured at near/far scales. Mobile viewport is functionally smoke-tested separately; this does not claim physical-device visual acceptance.'
          }, null, 2));
          // Release the desktop WebGL context before starting the mobile viewport.
          await page.close();

          // Repeat the real launch path in a touch-enabled mobile landscape viewport.
          const mobilePage = await browser.newPage({
            viewport: { width: 844, height: 390 },
            deviceScaleFactor: 1,
            hasTouch: true
          });
          const mobileErrors = [];
          mobilePage.on('pageerror', error => mobileErrors.push(error.message));
          mobilePage.on('console', message => console.log('[mobile console:' + message.type() + '] ' + message.text()));
          mobilePage.on('requestfailed', request => console.log('[mobile request failed] ' + request.url() + ' ' + (request.failure()?.errorText ?? 'unknown')));
          await mobilePage.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 10000 });
          await mobilePage.getByRole('button', { name: /PLAY MSHIN/i }).click();
          const mobileFrame = mobilePage.locator('#game-frame');
          await mobileFrame.waitFor({ state: 'attached', timeout: 10000 });
          const mobileFramePermissions = (await mobileFrame.getAttribute('allow') || '').split(';').map(value => value.trim());
          if (!mobileFramePermissions.includes('identity-credentials-get')) {
            throw new Error('Mobile game iframe must delegate Google FedCM identity-credentials-get permission');
          }
          await mobilePage.frameLocator('#game-frame').locator('canvas').waitFor({ state: 'visible', timeout: 20000 });
          // The mobile acceptance gate is functional (launcher + live canvas);
          // avoid a second WebGL screenshot because software-rendered mobile
          // emulation can stall Chromium's compositor.
          await mobilePage.waitForTimeout(2000);

          if (errors.length || mobileErrors.length) {
            throw new Error('Browser page errors: ' + [...errors, ...mobileErrors].join(' | '));
          }
          await browser.close();
          NODE
      - name: Upload real WebGL visual acceptance captures
        uses: actions/upload-artifact@v4
        with:
          name: mshin-webgl-visual-acceptance-${{ github.sha }}
          path: artifacts/visual-acceptance/
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy game to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
