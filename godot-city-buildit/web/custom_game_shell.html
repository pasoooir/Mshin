<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#071b2b">
  <title>$GODOT_PROJECT_NAME</title>
  <style>
    html, body, #canvas { margin: 0; padding: 0; border: 0; width: 100%; height: 100%; }
    body { overflow: hidden; background: #071b2b; touch-action: none; overscroll-behavior: none; }
    #canvas { display: block; outline: none; }
    #status, #status-splash, #status-progress, #status-notice {
      position: absolute; left: 0; right: 0;
    }
    #status { position: fixed; inset: 0; display: block; visibility: visible; background: #071b2b; }
    #status-splash { position: absolute; inset: 0; display: block; width: 100%; height: 100%;
      max-width: none; max-height: none; object-fit: cover; object-position: center; }
    .progress-track { position: absolute; left: 50%; bottom: max(28px, env(safe-area-inset-bottom));
      transform: translateX(-50%); width: min(72vw, 760px); height: 14px; overflow: hidden;
      border: 1px solid rgba(255,255,255,.9); border-radius: 999px;
      background: rgba(20, 28, 38, .72); box-shadow: 0 2px 12px rgba(0,0,0,.35); }
    .progress-fill { width: 0%; height: 100%; border-radius: inherit;
      background: linear-gradient(90deg, #1677ef, #28a5ff); transition: width .12s linear; }
    .progress-track.indeterminate .progress-fill { width: 32%; animation: loading-sweep 1.15s ease-in-out infinite; }
    @keyframes loading-sweep { from { transform: translateX(-110%); } to { transform: translateX(340%); } }
    #status-notice { display: none; top: 50%; transform: translateY(-50%); box-sizing: border-box;
      margin: 0 auto; width: min(90%, 720px); padding: 16px; border-radius: 10px;
      color: #fff; background: #5b2630; font: 16px/1.45 system-ui, sans-serif;
      text-align: center; white-space: pre-wrap; overflow-wrap: anywhere; }
    @media (max-width: 700px) {
       .progress-track { width: 78vw; height: 13px; bottom: max(22px, env(safe-area-inset-bottom)); }
    }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <canvas id="canvas" aria-label="Mshin City BuildIt game"></canvas>
  <noscript>JavaScript is required to run this game.</noscript>
  <div id="status" role="status" aria-live="polite">
    <img id="status-splash" src="Intro.jpg" alt="Mshin loading screen">
    <div class="progress-track indeterminate" id="progress-track" role="progressbar" aria-label="Loading game" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" id="progress-fill"></div></div>
    <div id="status-notice"></div>
  </div>
  <script src="$GODOT_URL"></script>
  <script>
    (() => {
      const config = $GODOT_CONFIG;
      const threadsEnabled = $GODOT_THREADS_ENABLED;
      const overlay = document.getElementById('status');
      const progressTrack = document.getElementById('progress-track');
      const progressFill = document.getElementById('progress-fill');
      const notice = document.getElementById('status-notice');
      let initializing = true;

      // Direct game URLs have no Play launcher, so the first real touch/click
      // is used to request fullscreen and landscape. Browser restrictions are non-fatal.
      let immersiveRequested = false;
      async function enterImmersiveLandscape() {
        if (immersiveRequested) return;
        immersiveRequested = true;
        try {
          if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
          }
        } catch (_) { /* Continue in the browser's normal display mode. */ }
        try {
          if (screen.orientation && screen.orientation.lock) {
            await screen.orientation.lock('landscape');
          }
        } catch (_) { /* iOS Safari and restricted browsers may reject orientation lock. */ }
      }
      document.addEventListener('pointerdown', enterImmersiveLandscape, { once: true, passive: true });
      document.addEventListener('touchend', enterImmersiveLandscape, { once: true, passive: true });

      function hideSplash() {
        if (!initializing) return;
        initializing = false;
        overlay.remove();
      }

      function showFailure(error) {
        console.error('Mshin startup failed:', error);
        notice.textContent = error instanceof Error ? error.message : String(error || 'An unknown startup error occurred.');
        progressTrack.style.display = 'none';
        notice.style.display = 'block';
      }

      const missing = Engine.getMissingFeatures({ threads: threadsEnabled });
      if (missing.length) {
        showFailure('This browser is missing features required to run the game:\n' + missing.join('\n'));
        return;
      }

      const engine = new Engine(config);
      engine.startGame({
        canvas: document.getElementById('canvas'),
        onProgress(current, total) {
          if (Number.isFinite(current) && Number.isFinite(total) && total > 0) {
            const percent = Math.max(0, Math.min(100, (current / total) * 100));
            progressTrack.classList.remove('indeterminate');
            progressTrack.setAttribute('aria-valuenow', String(Math.round(percent)));
            progressFill.style.width = percent.toFixed(2) + '%';
          } else {
            progressTrack.classList.add('indeterminate');
            progressTrack.removeAttribute('aria-valuenow');
            progressFill.style.width = '32%';
          }
        }
      }).then(hideSplash).catch(showFailure);
    })();
  </script>
</body>
</html>
