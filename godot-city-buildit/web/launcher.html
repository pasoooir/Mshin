<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071b2b">
  <meta name="description" content="Play Pasoo City BuildIt — a 3D mobile city-building game.">
  <title>Play Mshin City BuildIt</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; min-height: 100%; background: #071b2b; color: #f4fbff; }
    body { min-height: 100svh; overflow: hidden; }
    #game-frame { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; border: 0; background: #071b2b; }
    :fullscreen { width: 100vw; height: 100vh; }
    .landing { min-height: 100svh; display: grid; place-items: center; padding: 24px; text-align: center;
      background: radial-gradient(ellipse at 50% 15%, #236b80 0, #12394f 38%, #071b2b 78%); }
    .card { width: min(680px, 100%); padding: clamp(26px, 6vw, 56px); border: 1px solid #ffffff2b;
      border-radius: 28px; background: #071b2bcc; box-shadow: 0 24px 90px #0008; }
    .city { font-size: clamp(64px, 15vw, 112px); line-height: 1.1; }
    h1 { margin: 12px 0; font-size: clamp(30px, 6vw, 48px); letter-spacing: .04em; }
    p { color: #c3dbe7; line-height: 1.6; margin: 12px auto 28px; max-width: 490px; }
    button, .fallback { border: 0; border-radius: 999px; padding: 17px 34px; font-size: 17px; font-weight: 800;
      letter-spacing: .08em; cursor: pointer; color: #062231; background: linear-gradient(135deg, #a8f06a, #38d4c0);
      box-shadow: 0 10px 34px #28d6a744; }
    button:disabled { opacity: .7; cursor: wait; }
    .hint { display: block; margin-top: 18px; color: #8eafbf; font-size: 12px; }
    .fallback { display: inline-block; margin-top: 14px; padding: 10px 18px; font-size: 12px; text-decoration: none; }
    @media (orientation: portrait) { .hint::after { content: " Rotate your phone to landscape for the best experience."; } }
  </style>
</head>
<body>
  <main class="landing" id="landing">
    <section class="card">
      <div class="city" aria-hidden="true">🏙️</div>
      <h1>PASOO CITY BUILD IT</h1>
      <p>Build roads, grow your neighborhood, produce materials and expand your own 3D city.</p>
      <button id="play" type="button">▶ &nbsp; PLAY MSHIN</button>
      <span class="hint" id="hint">Designed for mobile landscape · Best experienced in fullscreen</span>
      <a class="fallback" id="direct-link" href="./game/__GAME_BUILD__/">OPEN GAME DIRECTLY</a>
    </section>
  </main>
  <script>
    (() => {
      const gameUrl = './game/__GAME_BUILD__/';
      const play = document.getElementById('play');
      const hint = document.getElementById('hint');

      // Google Identity Services runs in the top-level launcher, never in the
      // embedded Godot document. This avoids mobile FedCM iframe callback loss.
      const GOOGLE_CLIENT_ID = '437590540762-utd1hbi5pcgvhl7p5u36ivmj9il7q9sm.apps.googleusercontent.com';
      let googleIdentityPromise = null;
      let activeGoogleNonce = '';
      const loadGoogleIdentity = () => {
        if (window.google && window.google.accounts && window.google.accounts.id) return Promise.resolve();
        if (googleIdentityPromise) return googleIdentityPromise;
        googleIdentityPromise = new Promise((resolve, reject) => {
          let script = document.getElementById('mshin-google-identity-script');
          if (script && script.dataset.mshinState !== 'loading') { script.remove(); script = null; }
          const loaded = () => {
            if (window.google && window.google.accounts && window.google.accounts.id) resolve();
            else reject(new Error('Google Identity Services did not initialize'));
          };
          const failed = () => reject(new Error('Google Identity Services failed to load'));
          if (!script) {
            script = document.createElement('script');
            script.id = 'mshin-google-identity-script';
            script.src = 'https://accounts.google.com/gsi/client';
            script.async = true;
            script.defer = true;
            script.dataset.mshinState = 'loading';
            script.addEventListener('load', () => { script.dataset.mshinState = 'loaded'; loaded(); }, { once: true });
            script.addEventListener('error', () => { script.dataset.mshinState = 'failed'; failed(); }, { once: true });
            document.head.appendChild(script);
          } else {
            script.addEventListener('load', loaded, { once: true });
            script.addEventListener('error', failed, { once: true });
          }
        }).catch(error => { googleIdentityPromise = null; throw error; });
        return googleIdentityPromise;
      };

      const finishGoogleSignIn = (frame, nonce, credential) => {
        if (activeGoogleNonce !== nonce) return;
        activeGoogleNonce = '';
        const overlay = document.getElementById('mshin-google-signin-overlay');
        if (overlay) overlay.remove();
        if (frame && frame.contentWindow) {
          frame.contentWindow.postMessage({
            type: 'mshin-google-auth-response',
            nonce,
            credential: typeof credential === 'string' ? credential : null
          }, location.origin);
        }
      };

      window.addEventListener('message', async event => {
        const frame = document.getElementById('game-frame');
        if (!frame || event.source !== frame.contentWindow || event.origin !== location.origin) return;
        const request = event.data;
        if (!request || request.type !== 'mshin-google-auth-request') return;
        if (request.clientId !== GOOGLE_CLIENT_ID || typeof request.nonce !== 'string' || !/^[A-Za-z0-9_-]{40,60}$/.test(request.nonce)) return;
        if (activeGoogleNonce) finishGoogleSignIn(frame, activeGoogleNonce, null);
        const nonce = request.nonce;
        activeGoogleNonce = nonce;
        try {
          await loadGoogleIdentity();
          if (activeGoogleNonce !== nonce) return;
          window.google.accounts.id.initialize({
            client_id: GOOGLE_CLIENT_ID,
            nonce,
            auto_select: request.autoSelect === true,
            cancel_on_tap_outside: true,
            callback: response => finishGoogleSignIn(frame, nonce, response && response.credential ? response.credential : null)
          });
          if (request.autoSelect === true) {
            window.google.accounts.id.prompt(moment => {
              if (moment && (moment.isNotDisplayed() || moment.isSkippedMoment())) finishGoogleSignIn(frame, nonce, null);
            });
            return;
          }
          const overlay = document.createElement('div');
          overlay.id = 'mshin-google-signin-overlay';
          overlay.setAttribute('role', 'dialog');
          overlay.setAttribute('aria-label', 'Sign in with Google');
          overlay.style.cssText = 'position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(3,13,27,.82);backdrop-filter:blur(9px);';
          const card = document.createElement('div');
          card.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:18px;min-width:300px;max-width:92vw;padding:30px 26px 24px;border:1px solid rgba(91,215,247,.8);border-radius:22px;background:linear-gradient(145deg,#1c3d5d,#10253d);box-shadow:0 22px 70px rgba(0,0,0,.55);';
          const heading = document.createElement('div');
          heading.textContent = 'Connect your city';
          heading.style.cssText = 'font:700 22px system-ui,sans-serif;color:#f5fbff;';
          const subtitle = document.createElement('div');
          subtitle.textContent = 'Sign in securely to save and sync your progress';
          subtitle.style.cssText = 'font:14px system-ui,sans-serif;color:#c8dced;text-align:center;max-width:290px;';
          const button = document.createElement('div');
          button.id = 'mshin-google-render-button';
          const cancel = document.createElement('button');
          cancel.type = 'button';
          cancel.textContent = 'Cancel';
          cancel.style.cssText = 'border:0;border-radius:12px;padding:9px 20px;background:rgba(255,255,255,.10);color:#d8ebf7;font:600 14px system-ui,sans-serif;cursor:pointer;';
          cancel.addEventListener('click', () => finishGoogleSignIn(frame, nonce, null));
          card.append(heading, subtitle, button, cancel);
          overlay.appendChild(card);
          document.body.appendChild(overlay);
          window.google.accounts.id.renderButton(button, { type:'standard', theme:'outline', size:'large', text:'continue_with', shape:'pill', logo_alignment:'left', width:Math.min(300, Math.floor(window.innerWidth * .78)) });
        } catch (error) {
          console.error('[Mshin Google sign-in]', error);
          finishGoogleSignIn(frame, nonce, null);
        }
      });

      play.addEventListener('click', () => {
        // Launch immediately from the trusted tap. Do not await fullscreen or
        // orientation APIs before creating the game frame: on some Android
        // browsers those promises can be delayed or never settle.
        play.disabled = true;
        play.textContent = 'LOADING CITY…';
        hint.textContent = 'Starting your city…';

        // Request fullscreen synchronously while the tap activation is valid.
        let fullscreenRequest = null;
        try {
          if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
            fullscreenRequest = document.documentElement.requestFullscreen({ navigationUI: 'hide' });
          }
        } catch (_) { /* Fullscreen is optional; never block game launch. */ }

        const frame = document.createElement('iframe');
        frame.id = 'game-frame';
        frame.title = 'Pasoo City BuildIt';
        frame.allow = 'fullscreen; autoplay; gamepad; identity-credentials-get';
        frame.allowFullscreen = true;
        frame.src = gameUrl;
        document.body.replaceChildren(frame);
        document.documentElement.style.background = '#071b2b';
        document.body.style.background = '#071b2b';

        // Orientation lock is best-effort and must not gate iframe creation.
        const lockLandscape = () => {
          try {
            if (screen.orientation && screen.orientation.lock) {
              const result = screen.orientation.lock('landscape');
              if (result && typeof result.catch === 'function') result.catch(() => {});
            }
          } catch (_) { /* iOS Safari and restricted browsers may not support it. */ }
        };
        if (fullscreenRequest && typeof fullscreenRequest.then === 'function') {
          fullscreenRequest.then(lockLandscape).catch(() => {});
        } else {
          lockLandscape();
        }
      });
    })();
  </script>
</body>
</html>
