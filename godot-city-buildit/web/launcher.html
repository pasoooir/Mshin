<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071b2b">
  <meta name="description" content="Play Pasoo City BuildIt — a 3D mobile city-building game.">
  <title>Play Mshin City BuildIt</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; min-height: 100%; background: #071b2b; color: #f4fbff; }
    body { min-height: 100svh; overflow: hidden; }
    #game-frame { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; border: 0; background: #071b2b; }
    :fullscreen { width: 100vw; height: 100vh; }
    .landing { min-height: 100svh; display: grid; place-items: center; padding: 24px; text-align: center;
      background: radial-gradient(ellipse at 50% 15%, #236b80 0, #12394f 38%, #071b2b 78%); }
    .card { width: min(680px, 100%); padding: clamp(26px, 6vw, 56px); border: 1px solid #ffffff2b;
      border-radius: 28px; background: #071b2bcc; box-shadow: 0 24px 90px #0008; }
    .city { font-size: clamp(64px, 15vw, 112px); line-height: 1.1; }
    h1 { margin: 12px 0; font-size: clamp(30px, 6vw, 48px); letter-spacing: .04em; }
    p { color: #c3dbe7; line-height: 1.6; margin: 12px auto 28px; max-width: 490px; }
    button, .fallback { border: 0; border-radius: 999px; padding: 17px 34px; font-size: 17px; font-weight: 800;
      letter-spacing: .08em; cursor: pointer; color: #062231; background: linear-gradient(135deg, #a8f06a, #38d4c0);
      box-shadow: 0 10px 34px #28d6a744; }
    button:disabled { opacity: .7; cursor: wait; }
    .hint { display: block; margin-top: 18px; color: #8eafbf; font-size: 12px; }
    .fallback { display: inline-block; margin-top: 14px; padding: 10px 18px; font-size: 12px; text-decoration: none; }
    @media (orientation: portrait) { .hint::after { content: " Rotate your phone to landscape for the best experience."; } }
  </style>
</head>
<body>
  <main class="landing" id="landing">
    <section class="card">
      <div class="city" aria-hidden="true">🏙️</div>
      <h1>PASOO CITY BUILD IT</h1>
      <p>Build roads, grow your neighborhood, produce materials and expand your own 3D city.</p>
      <button id="play" type="button">▶ &nbsp; PLAY MSHIN</button>
      <span class="hint" id="hint">Designed for mobile landscape · Best experienced in fullscreen</span>
      <a class="fallback" id="direct-link" href="./game/__GAME_BUILD__/">OPEN GAME DIRECTLY</a>
    </section>
  </main>
  <script>
    (() => {
      const gameUrl = './game/__GAME_BUILD__/';
      const play = document.getElementById('play');
      const hint = document.getElementById('hint');

      play.addEventListener('click', () => {
        // Launch immediately from the trusted tap. Do not await fullscreen or
        // orientation APIs before creating the game frame: on some Android
        // browsers those promises can be delayed or never settle.
        play.disabled = true;
        play.textContent = 'LOADING CITY…';
        hint.textContent = 'Starting your city…';

        // Request fullscreen synchronously while the tap activation is valid.
        let fullscreenRequest = null;
        try {
          if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
            fullscreenRequest = document.documentElement.requestFullscreen({ navigationUI: 'hide' });
          }
        } catch (_) { /* Fullscreen is optional; never block game launch. */ }

        const frame = document.createElement('iframe');
        frame.id = 'game-frame';
        frame.title = 'Pasoo City BuildIt';
        frame.allow = 'fullscreen; autoplay; gamepad';
        frame.allowFullscreen = true;
        frame.src = gameUrl;
        document.body.replaceChildren(frame);
        document.documentElement.style.background = '#071b2b';
        document.body.style.background = '#071b2b';

        // Orientation lock is best-effort and must not gate iframe creation.
        const lockLandscape = () => {
          try {
            if (screen.orientation && screen.orientation.lock) {
              const result = screen.orientation.lock('landscape');
              if (result && typeof result.catch === 'function') result.catch(() => {});
            }
          } catch (_) { /* iOS Safari and restricted browsers may not support it. */ }
        };
        if (fullscreenRequest && typeof fullscreenRequest.then === 'function') {
          fullscreenRequest.then(lockLandscape).catch(() => {});
        } else {
          lockLandscape();
        }
      });
    })();
  </script>
</body>
</html>
