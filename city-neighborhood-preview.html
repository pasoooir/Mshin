const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, .1, 220);
camera.position.set(34,29,38);

controls.maxDistance = 78;

const hemi = new THREE.HemisphereLight("#e8f8ff","#6b7650",2.0);scene.add(hemi);

const mat=(color,roughness=.85,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const grass=mat("#75ae63"), grass2=mat("#83b86b"), asphalt=mat("#343f49",.98), sidewalk=mat("#c7c5b7"), curb=mat("#e5dfc9"), line=mat("#f7e9b7"), soil=mat("#896847"), white=mat("#fff1d1"), tactile=mat("#d6b96f");
const ground=new THREE.Mesh(new THREE.PlaneGeometry(130,130),grass);ground.rotation.x=-Math.PI/2;ground.position.y=-.18;ground.receiveShadow=true;scene.add(ground);

function box(parent,w,h,d,material,x,y,z,cast=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;parent.add(m);return m}
function roofGable(parent,w,d,h,material,x,y,z){
 const shape=new THREE.Shape();shape.moveTo(-w/2,0);shape.lineTo(w/2,0);shape.lineTo(0,h);shape.closePath();
 const geo=new THREE.ExtrudeGeometry(shape,{depth:d,bevelEnabled:false});geo.rotateX(-Math.PI/2);
 const mesh=new THREE.Mesh(geo,material);mesh.position.set(x,y,z-d/2);mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);return mesh;
}
function windowPane(parent,x,y,z,w=.32,h=.42){
 box(parent,w+.10,h+.10,.055,mat("#fff0ce"),x,y,z-.012,false);
 const glass=new THREE.MeshStandardMaterial({color:"#8ed4df",roughness:.22,metalness:.12,emissive:"#255f70",emissiveIntensity:.12});

function house(x,z,wallColor,roofColor,rotation=0){
 const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rotation;scene.add(g);
 const wall=mat(wallColor),roof=mat(roofColor),trim=mat("#f7e9cb"),door=mat("#76513c");
 box(g,4.2, .35,3.7,soil,0,.18,0);
 box(g,3.55,2.8,3.05,wall,0,1.72,0);
 box(g,3.72,.13,3.2,trim,0,3.13,0,false);
 roofGable(g,4.05,3.45,1.45,roof,0,3.2,0);
 for(const wx of [-1.12,1.12]){windowPane(g,wx,2.05,1.56,.52,.65);windowPane(g,wx,2.05,-1.56,.52,.65)}
 windowPane(g,0,2.05,1.56,.55,.65);
 box(g,.66,1.25,.09,door,.65,.85,1.57);
 box(g,.95,.12,.5,trim,.65,1.52,1.78);
 // porch canopy and columns
 box(g,1.5,.14,.9,roof,.65,2.25,2.0);
 for(const px of [.05,1.25])box(g,.10,1.05,.10,trim,px,1.62,2.28);

 box(g,.48,.9,.48,mat("#a65c49"),-1.1,4.05,-.65);
 return g;
}
function apartment(x,z,rotation=0){
 const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rotation;scene.add(g);
 const wall=mat("#dfc7a1"),side=mat("#c7a77d"),roof=mat("#526f79"),white=mat("#f5e9cf"),glass=mat("#83c9d8",.2,.12),metal=mat("#53666a",.55,.45);
 box(g,5.2,.3,4.5,soil,0,.16,0);
 const body=box(g,4.5,7.2,3.8,wall,0,3.9,0);body.material=[side,side,wall,roof,wall,side];
 box(g,4.8,.22,4.1,white,0,7.58,0);
 box(g,5,.18,4.3,roof,0,7.78,0);
 for(let floor=0;floor<4;floor++){
  const yy=1.35+floor*1.55;
  for(const xx of [-1.35,0,1.35]){
   box(g,.76,.9,.08,glass,xx,yy,1.94,false);
   box(g,.86,.09,.15,white,xx,yy-.52,2.02,false);
   box(g,.86,.08,.15,metal,xx,yy-.95,2.12,false);
   box(g,.06,.42,.06,metal,xx-.4,yy-.73,2.13,false);
   box(g,.06,.42,.06,metal,xx+.4,yy-.73,2.13,false);
  }
 }
 // corner vertical fins and entrance
 for(const xx of [-2.1,2.1])box(g,.12,6.7,.12,white,xx,3.85,1.94);
 box(g,.9,1.7,.10,mat("#416a70"),0,1.05,1.97);
 return g;
}
function shop(x,z,rotation=0){
 const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rotation;scene.add(g);
 const wall=mat("#e8b46d"),teal=mat("#247f83"),glass=mat("#8fd7dc",.18,.12),white=mat("#fff1d1");
 box(g,4.6,.28,3.7,soil,0,.15,0);box(g,4.1,3.3,3.2,wall,0,1.85,0);
 box(g,4.25,.16,3.35,teal,0,3.56,0);
 box(g,4.25,.32,.22,teal,0,2.95,1.66);
 box(g,3.2,1.25,.10,glass,0,1.85,1.64,false);
 box(g,.12,1.3,.12,white,-1.65,1.85,1.73,false);box(g,.12,1.3,.12,white,1.65,1.85,1.73,false);
 box(g,1.05,1.55,.13,mat("#8c6249"),.65,.95,1.7);
 // striped awning
 box(g,4.35,.18,.92,white,0,2.65,2.05);
 for(let i=-4;i<=4;i++)box(g,.42,.19,.95,i%2?white:teal,i*.48,2.65,2.06,false);
 box(g,2.4,.46,.14,mat("#f6d17c"),0,3.22,1.72,false);
 for(let i=-2;i<=2;i++)box(g,.035,.32,.16,teal,i*.4,3.22,1.81,false);

}
function tree(x,z,scale=1){
 const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(scale);scene.add(g);
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.27,2.1,8),mat("#795037"));trunk.position.y=1.05;trunk.castShadow=true;g.add(trunk);
 const greens=["#2e7948","#398b4d","#5b9c51"];
 for(let i=0;i<3;i++){const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.0-i*.12,1),mat(greens[i]));crown.position.set((i-1)*.36,2.55+(i%2)*.38,(i%2)*.18);crown.scale.set(1.05,.95,1);crown.castShadow=true;g.add(crown)}
 return g;
}
function lamp(x,z){
 const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
 const dark=mat("#38484a",.5,.5);const pole=new THREE.Mesh(new THREE.CylinderGeometry(.055,.08,3.2,8),dark);pole.position.y=1.6;g.add(pole);
 const arm=box(g,.75,.07,.07,dark,.34,3.12,0,false);arm.rotation.z=-.12;
 const bulb=new THREE.Mesh(new THREE.SphereGeometry(.18,10,8),new THREE.MeshStandardMaterial({color:"#fff3c0",emissive:"#ffdc7c",emissiveIntensity:.7}));bulb.position.set(.65,3.0,0);g.add(bulb);
}
function curbRunX(z){
 const rawGaps=[-10,10].flatMap(center=>[[center-3.55,center+3.55],[center-4.4-1.35,center-4.4+1.35],[center+4.4-1.35,center+4.4+1.35]]).sort((a,b)=>a[0]-b[0]);
 const gaps=[];
 for(const gap of rawGaps){const last=gaps[gaps.length-1];if(last&&gap[0]<=last[1])last[1]=Math.max(last[1],gap[1]);else gaps.push([...gap]);}
 let cursor=-29;
 for(const [start,end] of gaps){if(start>cursor){const segment=box(scene,start-cursor,.14,.18,curb,(start+cursor)/2,.12,z,false);segment.name="city-road-curb";}cursor=end;}
 if(cursor<29){const segment=box(scene,29-cursor,.14,.18,curb,(29+cursor)/2,.12,z,false);segment.name="city-road-curb";}
}
function curbRunZ(x){
 const rawGaps=[-9,10].flatMap(center=>[[center-3.55,center+3.55],[center-4.4-1.35,center-4.4+1.35],[center+4.4-1.35,center+4.4+1.35]]).sort((a,b)=>a[0]-b[0]);
 const gaps=[];
 for(const gap of rawGaps){const last=gaps[gaps.length-1];if(last&&gap[0]<=last[1])last[1]=Math.max(last[1],gap[1]);else gaps.push([...gap]);}
 let cursor=-29;
 for(const [start,end] of gaps){if(start>cursor){const segment=box(scene,.18,.14,start-cursor,curb,x,.12,(start+cursor)/2,false);segment.name="city-road-curb";}cursor=end;}
 if(cursor<29){const segment=box(scene,.18,.14,29-cursor,curb,x,.12,(29+cursor)/2,false);segment.name="city-road-curb";}
}
function roadX(z){
 box(scene,58,.12,7,asphalt,0,.02,z);curbRunX(z-3.58);curbRunX(z+3.58);
 box(scene,58,.08,1.35,sidewalk,0,.08,z-4.35);box(scene,58,.08,1.35,sidewalk,0,.08,z+4.35);
 for(let x=-27;x<28;x+=4)box(scene,1.8,.025,.12,line,x,.095,z,false);
}
function roadZ(x){
 box(scene,7,.13,58,asphalt,x,.025,0);curbRunZ(x-3.58);curbRunZ(x+3.58);
 box(scene,1.35,.08,58,sidewalk,x-4.35,.08,0);box(scene,1.35,.08,58,sidewalk,x+4.35,.08,0);
 for(let z=-27;z<28;z+=4)box(scene,.12,.025,1.8,line,x,.095,z,false);
}
function addCurbRamp(x,z,orientation,sign){
 const ramp=orientation==="horizontal"
  ? box(scene,2.6,.08,1.15,sidewalk,x,.13,z,false)
  : box(scene,1.15,.08,2.6,sidewalk,x,.13,z,false);
 ramp.name="city-curb-ramp";
 if(orientation==="horizontal")ramp.rotation.x=-sign*.11;
 else ramp.rotation.z=sign*.11;
 for(let i=-2;i<=2;i++){
  const tile=box(scene,.18,.025,.16,tactile,x+i*.34,.19,z+(orientation==="horizontal"?sign*.5:0),false);
  if(orientation==="vertical"){tile.position.x=x+sign*.5;tile.position.z=z+i*.34;}
  tile.name="city-tactile-paving";

}
function addCrosswalkStripe(x,z,orientation){

  ? box(scene,.75,.035,.18,white,x,.14,z,false)

// A compact four-block neighborhood: two intersecting streets and distinct building types.
roadX(-9);roadX(10);roadZ(-10);roadZ(10);
// These painted crossings are preview-only visual cues at the four road junctions;

for(const [x,z] of [[-10,-9],[10,-9],[-10,10],[10,10]]){
 box(scene,7.1,.04,7.1,mat("#65727a"),x,.105,z,false);

  addCrosswalkStripe(x+i*1.15,z-4.4,"horizontal");
  addCrosswalkStripe(x+i*1.15,z+4.4,"horizontal");
  addCrosswalkStripe(x-4.4,z+i*1.15,"vertical");
  addCrosswalkStripe(x+4.4,z+i*1.15,"vertical");
 }
 for(const offset of [-4.4,4.4]){
  addCurbRamp(x+offset,z-3.95,"horizontal",-1);addCurbRamp(x+offset,z+3.95,"horizontal",1);
  addCurbRamp(x-3.95,z+offset,"vertical",-1);addCurbRamp(x+3.95,z+offset,"vertical",1);
 }
}
const modelFallbacks = [
 {type:"house",group:house(-20,-20,"#efc58b","#b95d49",.08),position:[-20,0,-20],rotation:.08},
 {type:"apartment",group:apartment(0,1,-.04),position:[0,0,1],rotation:-.04},
 {type:"shop",group:shop(-20,1,.04),position:[-20,0,1],rotation:.04}
];
house(-1,-20,"#e5a5a0","#52778b",-.06);house(20,-20,"#c6dca4","#c87950",.12);
shop(20,1,Math.PI);apartment(-20,21,.06);house(0,21,"#e6d49b","#5c8c7a",-.1);shop(20,21,.03);
const architectureLoader = new GLTFLoader();
const architectureModels = new Map();
const architectureManifest = await fetch("./assets/city/models/manifest.json").then(response=>{if(!response.ok)throw new Error("City architecture manifest unavailable");return response.json();});
await Promise.all(architectureManifest.assets.map(async asset=>{
 try{
  const gltf=await architectureLoader.loadAsync(asset.uri);
  const fallback=modelFallbacks.find(item=>item.type===asset.buildingType);
  if(!fallback)return;
  fallback.group.removeFromParent();
  const model=gltf.scene;model.name=asset.id;model.position.set(...fallback.position);model.rotation.y=fallback.rotation;model.scale.set(...(asset.scale ?? [1,1,1]));
  architectureModels.set(asset.buildingType,model);
  model.traverse(object=>{if(object.isMesh){object.castShadow=true;object.receiveShadow=true;}});
  scene.add(model);
 }catch(error){console.warn("Using procedural city building fallback:",asset.buildingType,error);}
