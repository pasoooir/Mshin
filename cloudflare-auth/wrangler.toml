name = "mshin-player-auth"
main = "src/worker.js"
compatibility_date = "2026-11-16"
compatibility_flags = ["nodejs_compat"]

# Google identity mapping only. Player JSON stays in the private GitHub repo.
[[d1_databases]]
binding = "IDENTITIES"
database_name = "mshin-player-identities"
database_id = "047b9ec7-5d1c-49d6-a1a9-20c10cebb502"

# One Durable Object serializes all profile and marketplace mutations so
# GitHub's branch ref cannot be concurrently advanced by competing requests.
[[durable_objects.bindings]]
name = "API_COORDINATOR"
class_name = "MshinApiCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MshinApiCoordinator"]

[vars]
GOOGLE_CLIENT_ID = "REPLACE_WITH_GOOGLE_WEB_CLIENT_ID"
GAME_ORIGIN = "https://pasoooir.github.io"
GITHUB_JSON_REPOSITORY = "pasoooir/mshin-player-data"
GITHUB_JSON_BRANCH = "main"

# Secrets (never commit their values):
# wrangler secret put AUTH_TOKEN_SECRET
# wrangler secret put GITHUB_JSON_TOKEN
